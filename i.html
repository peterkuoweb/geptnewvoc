<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 單字卡生成器 (v6 自訂批次版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .card-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        /* Slider styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -6px; 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 z-10">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-2"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
                AI 單字卡生成器 (v6 自訂批次版)
            </h1>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <span class="text-sm text-gray-500 whitespace-nowrap">API Key:</span>
                <input type="password" id="apiKeyInput" value="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" class="border border-gray-300 rounded px-2 py-1 text-sm flex-1 md:w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="sk-or-v1-...">
                <button id="btnTestKey" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2 py-1 rounded">測試連線</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto p-4 flex flex-col md:flex-row gap-4 overflow-hidden">
        
        <!-- Left Panel: Input & Controls -->
        <div class="w-full md:w-1/3 flex flex-col gap-4 bg-white p-4 rounded-lg shadow h-full overflow-y-auto">
            
            <!-- Reference File Upload -->
            <div class="bg-indigo-50 p-3 rounded border border-indigo-100">
                <label class="block text-sm font-bold text-indigo-800 mb-1 flex justify-between items-center">
                    <span>📚 步驟 1: 參考字彙表 (GEPT)</span>
                    <span id="refStatus" class="text-xs font-normal text-gray-500">未載入</span>
                </label>
                <input type="file" id="fileInput" accept=".json,.txt" class="block w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 mb-2"/>
                <button id="btnMergeWords" class="w-full text-xs bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-100 py-1 px-2 rounded hidden transition">
                    ➕ 自動加入檔案中未列出的單字
                </button>
            </div>

            <!-- Restore Backup Input (Hidden initially) -->
            <input type="file" id="backupInput" accept=".json" class="hidden">

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">📝 步驟 2: 輸入單字列表</label>
                <textarea id="inputWords" class="w-full h-48 p-3 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono text-sm" placeholder="apple&#10;banana&#10;cat..."></textarea>
                <div class="flex justify-between mt-1">
                    <button id="btnLoadDemo" class="text-xs text-indigo-500 hover:underline">載入範例 (30個)</button>
                    <p class="text-xs text-gray-500">已輸入: <span id="inputCount">0</span> 個單字</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="btnStart" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition flex items-center justify-center gap-2 shadow-md hover:shadow-lg">
                    <span id="btnStartIcon">▶</span> <span id="btnStartText">開始設定與生成</span>
                </button>
                <button id="btnPause" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 px-4 rounded transition hidden shadow-md">
                    暫停
                </button>
                <button id="btnClear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded transition">
                    清除重置
                </button>
            </div>

            <div id="statusBox" class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded hidden transition-all shadow-sm">
                <p class="text-sm text-blue-700 font-medium break-words" id="statusText">準備就緒</p>
            </div>

            <hr class="border-gray-200">

            <div class="flex flex-col gap-2">
                 <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-700">進度</span>
                    <span class="text-xs text-gray-500" id="progressText">0 / 0</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner">
                    <div id="progressBar" class="bg-green-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                 <p class="text-xs text-gray-500 text-right" id="estimatedTime">剩餘時間: 計算中...</p>
            </div>

             <div class="mt-auto pt-4">
                <button id="btnDownload" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-4 rounded flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    下載 JSON 結果
                </button>
            </div>
        </div>

        <!-- Right Panel: Results Preview -->
        <div class="w-full md:w-2/3 flex flex-col bg-white rounded-lg shadow h-full overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700 flex items-center gap-2">
                    生成結果預覽
                    <span class="text-xs font-normal text-gray-500 ml-2">(顯示最新生成)</span>
                </h2>
                <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded-full" id="resultCountBadge">0 筆資料</span>
            </div>
            <div class="flex-1 overflow-auto p-4 bg-gray-50" id="resultsContainer">
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mb-2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                    <p>尚未生成任何資料</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for Settings & Backup -->
    <div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl p-6 w-96 shadow-2xl transform transition-all scale-100 border border-gray-200">
            <h3 class="text-xl font-bold text-indigo-700 mb-4 flex items-center gap-2">
                ⚙️ 生成設定
            </h3>

            <!-- Batch Size Slider -->
            <div class="mb-6">
                <label class="flex justify-between text-sm font-semibold text-gray-700 mb-2">
                    <span>單次批次數量</span>
                    <span id="batchSizeDisplay" class="text-indigo-600 font-bold bg-indigo-50 px-2 rounded">10</span>
                </label>
                <input type="range" id="batchSizeRange" min="5" max="21" value="10" step="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-xs text-gray-400 mt-1">
                    <span>5 (慢/穩)</span>
                    <span>21 (快/險)</span>
                </div>
            </div>

            <hr class="border-gray-200 mb-4">
            
            <p class="text-sm text-gray-600 mb-4 font-medium">是否要恢復上次的進度？</p>
            
            <div class="flex flex-col gap-3">
                <button id="btnYesBackup" class="w-full py-2.5 bg-white border-2 border-indigo-600 text-indigo-700 rounded-lg hover:bg-indigo-50 font-semibold text-sm flex items-center justify-center gap-2 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    上傳備份檔 (JSON)
                </button>
                <button id="btnNoBackup" class="w-full py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-sm shadow-md transition transform active:scale-95">
                    🚀 直接開始生成
                </button>
            </div>
            
            <button id="btnCancelModal" class="mt-4 text-xs text-gray-400 hover:text-gray-600 w-full text-center underline">取消</button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const CONFIG = {
            localStorageKey: 'vocab_generator_state_v6',
            models: [
                'xiaomi/mimo-v2-flash:free',
                'mistralai/devstral-2512:free',
                'nvidia/nemotron-3-nano-30b-a3b:free'
            ],
            apiEndpoint: 'https://openrouter.ai/api/v1/chat/completions',
            siteUrl: 'http://localhost', 
            siteName: 'VocabGenLocal'
        };

        let state = {
            inputRaw: '',
            wordList: [],
            processedMap: {}, 
            currentIndex: 0,
            isProcessing: false,
            averageTimePerBatch: 0,
            batchSize: 10 // Default
        };

        let referenceDictionary = new Map(); 

        // --- DOM Elements ---
        const els = {
            input: document.getElementById('inputWords'),
            inputCount: document.getElementById('inputCount'),
            apiKey: document.getElementById('apiKeyInput'),
            fileInput: document.getElementById('fileInput'),
            backupInput: document.getElementById('backupInput'),
            refStatus: document.getElementById('refStatus'),
            btnMergeWords: document.getElementById('btnMergeWords'),
            btnStart: document.getElementById('btnStart'),
            btnStartText: document.getElementById('btnStartText'),
            btnStartIcon: document.getElementById('btnStartIcon'),
            btnPause: document.getElementById('btnPause'),
            btnClear: document.getElementById('btnClear'),
            btnDownload: document.getElementById('btnDownload'),
            btnTestKey: document.getElementById('btnTestKey'),
            btnLoadDemo: document.getElementById('btnLoadDemo'),
            statusBox: document.getElementById('statusBox'),
            statusText: document.getElementById('statusText'),
            progressBar: document.getElementById('progressBar'),
            progressText: document.getElementById('progressText'),
            estimatedTime: document.getElementById('estimatedTime'),
            resultsContainer: document.getElementById('resultsContainer'),
            emptyState: document.getElementById('emptyState'),
            resultCountBadge: document.getElementById('resultCountBadge'),
            // Modal Elements
            modal: document.getElementById('modalOverlay'),
            btnYesBackup: document.getElementById('btnYesBackup'),
            btnNoBackup: document.getElementById('btnNoBackup'),
            btnCancelModal: document.getElementById('btnCancelModal'),
            batchSizeRange: document.getElementById('batchSizeRange'),
            batchSizeDisplay: document.getElementById('batchSizeDisplay')
        };

        // --- Initialization ---
        window.onload = () => {
            loadState();
            updateUI();
            els.input.addEventListener('input', handleInputUpdate);
        };

        function handleInputUpdate() {
            const raw = els.input.value;
            const words = raw.split('\n').map(w => w.trim()).filter(w => w);
            els.inputCount.textContent = words.length;
            
            if (!state.isProcessing) {
                state.inputRaw = raw;
                if (Object.keys(state.processedMap).length === 0) {
                     state.wordList = words;
                }
            }
        }

        // --- Modal & Batch Size Logic ---

        // Update Slider Display
        els.batchSizeRange.addEventListener('input', (e) => {
            const val = e.target.value;
            els.batchSizeDisplay.textContent = val;
            state.batchSize = parseInt(val);
        });

        // Open Modal
        function showStartModal() {
            els.modal.classList.remove('hidden');
        }

        function hideModal() {
            els.modal.classList.add('hidden');
        }

        els.btnCancelModal.addEventListener('click', hideModal);

        els.btnNoBackup.addEventListener('click', () => {
            // Update batch size from slider
            state.batchSize = parseInt(els.batchSizeRange.value);
            hideModal();
            startGenerationLoop();
        });

        els.btnYesBackup.addEventListener('click', () => {
            // Update batch size before triggering file input
            state.batchSize = parseInt(els.batchSizeRange.value);
            els.backupInput.click();
        });


        // --- Reference File Logic ---
        els.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    processReferenceJSON(json);
                } catch (err) {
                    alert("檔案格式錯誤 (JSON Parse Error)");
                }
            };
            reader.readAsText(file);
        });

        function processReferenceJSON(jsonArray) {
            if (!Array.isArray(jsonArray)) { alert("格式錯誤: 必須是陣列"); return; }
            referenceDictionary.clear();
            let count = 0;
            jsonArray.forEach(item => {
                if (item["字彙"] && item["級數"]) {
                    referenceDictionary.set(item["字彙"].toLowerCase().trim(), item["級數"].trim());
                    count++;
                }
            });
            els.refStatus.textContent = `已載入 ${count} 字`;
            els.refStatus.className = "text-xs font-bold text-green-600";
            if (count > 0) els.btnMergeWords.classList.remove('hidden');
            showStatus(`參考表載入成功: ${count} 字`, "text-green-700", "bg-green-50", "border-green-500");
        }

        els.btnMergeWords.addEventListener('click', () => {
            if (referenceDictionary.size === 0) return;
            if (state.isProcessing) { alert("請先暫停生成"); return; }
            const currentWordsSet = new Set(els.input.value.split('\n').map(w => w.trim().toLowerCase()).filter(w => w));
            let newWordsList = els.input.value.split('\n');
            let added = 0;
            for (const [refWord, _] of referenceDictionary) {
                if (!currentWordsSet.has(refWord)) {
                    newWordsList.push(refWord);
                    added++;
                }
            }
            if (added > 0) {
                state.inputRaw = newWordsList.map(w => w.trim()).filter(w=>w).join('\n');
                els.input.value = state.inputRaw;
                handleInputUpdate();
                alert(`已加入 ${added} 個新單字！`);
            } else {
                alert("沒有新單字可加入");
            }
        });

        // --- Backup Restore Logic ---
        els.backupInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    if(Array.isArray(json)) {
                        let restoredCount = 0;
                        json.forEach(item => {
                            if(item.word) {
                                state.processedMap[item.word.toLowerCase()] = item;
                                restoredCount++;
                            }
                        });
                        alert(`成功還原 ${restoredCount} 筆資料！將從斷點繼續。\n目前批次大小設定為: ${state.batchSize}`);
                        renderAllResults();
                        hideModal();
                        startGenerationLoop();
                    } else {
                        alert("備份檔格式不正確 (不是陣列)");
                    }
                } catch (err) {
                    alert("檔案讀取失敗");
                }
            };
            reader.readAsText(file);
        });

        // --- State Management ---
        function saveState() {
            try {
                const processedArray = Object.values(state.processedMap);
                localStorage.setItem(CONFIG.localStorageKey, JSON.stringify({
                    inputRaw: state.inputRaw,
                    processedData: processedArray, 
                    currentIndex: state.currentIndex,
                    averageTimePerBatch: state.averageTimePerBatch,
                    apiKey: els.apiKey.value,
                    batchSize: state.batchSize
                }));
            } catch (e) {
                console.error("Save failed:", e);
            }
        }

        function loadState() {
            const saved = localStorage.getItem(CONFIG.localStorageKey);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if(parsed.apiKey) els.apiKey.value = parsed.apiKey;
                    state.inputRaw = parsed.inputRaw || '';
                    state.currentIndex = parsed.currentIndex || 0;
                    state.averageTimePerBatch = parsed.averageTimePerBatch || 0;
                    if(parsed.batchSize) {
                        state.batchSize = Math.max(5, Math.min(21, parsed.batchSize));
                        els.batchSizeRange.value = state.batchSize;
                        els.batchSizeDisplay.textContent = state.batchSize;
                    }
                    
                    state.processedMap = {};
                    if(Array.isArray(parsed.processedData)) {
                        parsed.processedData.forEach(item => {
                            if(item.word) state.processedMap[item.word.toLowerCase()] = item;
                        });
                    }

                    els.input.value = state.inputRaw;
                    handleInputUpdate();
                    renderAllResults();
                } catch (e) { console.error(e); }
            }
        }

        function clearState() {
            if(confirm("確定重置？這會清除所有進度。")) {
                localStorage.removeItem(CONFIG.localStorageKey);
                location.reload();
            }
        }

        // --- Core Generation Logic ---

        function handleStartClick() {
            if (state.isProcessing) return; 

            const words = els.input.value.split('\n').map(w => w.trim()).filter(w => w);
            if (words.length === 0) { alert("請輸入單字"); return; }
            
            // Sync word list
            state.wordList = words;
            state.inputRaw = els.input.value;

            const apiKey = els.apiKey.value.trim();
            if (!apiKey) { alert("請輸入 API Key"); return; }

            // Always show modal to allow setting batch size
            showStartModal();
        }

        function startGenerationLoop() {
            state.isProcessing = true;
            updateUI();
            processNextBatch();
        }

        function pauseProcessing() {
            state.isProcessing = false;
            updateUI();
            showStatus("已暫停", "text-yellow-700", "bg-yellow-50", "border-yellow-500");
        }

        async function processNextBatch() {
            if (!state.isProcessing) return;

            // Dynamically collect batch based on current slider setting
            const CURRENT_BATCH_SIZE = state.batchSize;
            let batch = [];
            
            // Linear scan to find next unprocessed words
            while (state.currentIndex < state.wordList.length && batch.length < CURRENT_BATCH_SIZE) {
                const word = state.wordList[state.currentIndex];
                const cleanWord = word.toLowerCase();
                
                if (state.processedMap[cleanWord]) {
                    state.currentIndex++;
                } else {
                    batch.push(word);
                    state.currentIndex++; 
                }
            }

            if (batch.length === 0) {
                if (state.currentIndex >= state.wordList.length) {
                    finishProcessing();
                } else {
                    setTimeout(processNextBatch, 100);
                }
                return;
            }

            const startTime = Date.now();
            
            try {
                const dataArray = await fetchBatchWithFallback(batch, els.apiKey.value.trim());
                
                dataArray.forEach(item => {
                    // Inject Category
                    const refLevel = referenceDictionary.get(item.word.toLowerCase().trim());
                    item.category = refLevel ? `全民英檢(${refLevel})` : "無";
                    
                    state.processedMap[item.word.toLowerCase()] = item;
                    renderSingleResult(item, true);
                });

                const duration = Date.now() - startTime;
                updateStats(duration, CURRENT_BATCH_SIZE);
                saveState();
                updateUI();

                setTimeout(processNextBatch, 1000); 

            } catch (error) {
                console.error("Batch Failed:", error);
                if (error.message.includes("401")) {
                    state.isProcessing = false;
                    updateUI();
                    alert("API Key 無效 (401)。請檢查 Key。");
                    return;
                }
                // Rollback index
                state.currentIndex -= batch.length; 
                state.isProcessing = false;
                updateUI();
                showStatus(`批次失敗: ${error.message}。請暫停後重新開始。`, "text-red-700", "bg-red-50", "border-red-500");
            }
        }

        async function fetchBatchWithFallback(wordsArray, apiKey) {
            let lastError = null;

            for (const model of CONFIG.models) {
                const displayModel = model.split('/')[1];
                showStatus(
                    `正在批次處理 ${wordsArray.length} 個單字... [${displayModel}]`, 
                    "text-indigo-700", "bg-indigo-50", "border-indigo-500"
                );

                try {
                    return await fetchBatchData(wordsArray, apiKey, model);
                } catch (e) {
                    console.warn(`Model ${model} failed:`, e);
                    lastError = e;
                    if (e.message.includes("401")) throw e;
                }
            }
            throw new Error(`所有模型皆失敗: ${lastError ? lastError.message : '未知'}`);
        }

        async function fetchBatchData(words, apiKey, model) {
            const prompt = `
            Analyze: ${JSON.stringify(words)}.
            Return JSON ARRAY.
            Format per object:
            {
                "word": "word",
                "part_of_speech": "POS",
                "definition_zh": "Trad Chinese def",
                "example_en": "Eng example",
                "example_zh": "Trad Chinese trans",
                "special_usage": "Usage or '無'"
            }
            OUTPUT RAW JSON ARRAY ONLY.
            `;

            const response = await fetch(CONFIG.apiEndpoint, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': CONFIG.siteUrl,
                    'X-Title': CONFIG.siteName,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: "system", content: "You are a dictionary API. Output raw JSON array only." },
                        { role: "user", content: prompt }
                    ]
                })
            });

            if (!response.ok) {
                if (response.status === 401) throw new Error("401 Unauthorized");
                throw new Error(`API ${response.status}`);
            }

            const resJson = await response.json();
            let content = resJson.choices[0].message.content;
            content = content.replace(/```json/g, '').replace(/```/g, '').trim();
            
            try {
                const parsed = JSON.parse(content);
                if (!Array.isArray(parsed)) throw new Error("Not an array");
                return parsed;
            } catch (e) {
                throw new Error("JSON Parse Failed");
            }
        }

        // --- UI Helpers ---

        function finishProcessing() {
            state.isProcessing = false;
            updateUI();
            showStatus("🎉 完成！", "text-green-700", "bg-green-50", "border-green-500");
            saveState();
        }

        function updateUI() {
            const total = state.wordList.length || 0;
            const processedCount = Object.keys(state.processedMap).length;
            const percent = total === 0 ? 0 : Math.round((processedCount / total) * 100);

            els.progressBar.style.width = `${percent}%`;
            els.progressText.textContent = `${processedCount} / ${total} (${percent}%)`;
            els.resultCountBadge.textContent = `${processedCount} 筆`;

            if (state.isProcessing) {
                els.btnStart.classList.add('hidden');
                els.btnPause.classList.remove('hidden');
                els.input.disabled = true;
                els.fileInput.disabled = true;
                els.apiKey.disabled = true;
            } else {
                els.btnStart.classList.remove('hidden');
                els.btnPause.classList.add('hidden');
                
                if (processedCount > 0 && processedCount < total) {
                    els.btnStartText.textContent = "繼續生成";
                    els.btnStartIcon.textContent = "⏯";
                } else if (processedCount === total && total > 0) {
                     els.btnStartText.textContent = "重新生成 (需清除)";
                     els.btnStart.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    els.btnStartText.textContent = "開始設定與生成";
                    els.btnStartIcon.textContent = "▶";
                    els.btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
                }
                
                els.input.disabled = (processedCount > 0);
                els.apiKey.disabled = false;
                els.fileInput.disabled = false;
            }

            els.btnDownload.disabled = processedCount === 0;

            if (processedCount > 0) els.emptyState.classList.add('hidden');
        }

        function updateStats(lastBatchDuration, batchSize) {
            const timePerWord = lastBatchDuration / batchSize;
            const remainingWords = state.wordList.length - Object.keys(state.processedMap).length;
            const ms = remainingWords * timePerWord;
            
            let timeStr = ms < 60000 ? `${Math.ceil(ms/1000)} 秒` : `${Math.ceil(ms/60000)} 分鐘`;
            els.estimatedTime.textContent = `剩餘約: ${timeStr} (批次:${batchSize})`;
        }

        function showStatus(msg, text, bg, border) {
            els.statusBox.classList.remove('hidden');
            els.statusBox.className = `border-l-4 p-3 rounded mb-2 ${bg} ${border} shadow-sm`;
            els.statusText.textContent = msg;
        }

        function renderAllResults() {
            els.resultsContainer.innerHTML = '';
            els.resultsContainer.appendChild(els.emptyState);
            const orderedData = state.wordList
                .map(w => state.processedMap[w.toLowerCase()])
                .filter(item => item);
            [...orderedData].reverse().forEach(data => renderSingleResult(data, false));
        }

        function renderSingleResult(data, animate) {
            if (!els.emptyState.classList.contains('hidden')) els.emptyState.classList.add('hidden');
            
            const div = document.createElement('div');
            div.className = "bg-white border border-gray-200 rounded p-4 mb-3 shadow-sm text-sm relative group";
            if (animate) div.classList.add('card-enter');

            let catBadge = '';
            if (data.category && data.category !== '無') {
                catBadge = `<span class="absolute top-4 right-4 bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-bold border border-green-200 shadow-sm">${data.category}</span>`;
            }

            div.innerHTML = `
                ${catBadge}
                <div class="font-bold text-indigo-700 text-lg flex items-center gap-2">
                    ${data.word} 
                    <span class="text-xs font-normal text-gray-500 bg-gray-100 px-1 rounded">${data.part_of_speech}</span>
                </div>
                <div class="text-gray-800 font-medium mb-2 pr-16">${data.definition_zh}</div>
                <div class="bg-gray-50 p-2 border-l-2 border-indigo-200 text-gray-600 italic">"${data.example_en}"</div>
                <div class="pl-2 text-gray-400 text-xs mt-1 mb-2">${data.example_zh}</div>
                ${data.special_usage && data.special_usage !== '無' ? `<div class="text-xs text-orange-600 bg-orange-50 px-2 py-1 rounded inline-block">用法: ${data.special_usage}</div>` : ''}
            `;
            els.resultsContainer.insertBefore(div, els.resultsContainer.firstChild);
        }

        function downloadJSON() {
            const orderedData = state.wordList
                .map(w => state.processedMap[w.toLowerCase()])
                .filter(item => item);
            const blob = new Blob([JSON.stringify(orderedData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `vocab_${new Date().getTime()}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        // Listeners
        els.btnStart.addEventListener('click', handleStartClick);
        els.btnPause.addEventListener('click', pauseProcessing);
        els.btnClear.addEventListener('click', clearState);
        els.btnDownload.addEventListener('click', downloadJSON);
        els.btnTestKey.addEventListener('click', async () => {
            els.btnTestKey.disabled = true;
            els.btnTestKey.textContent = "...";
            try { await fetchBatchData(["test"], els.apiKey.value, CONFIG.models[0]); alert("OK"); saveState(); } 
            catch (e) { alert("Fail: "+e.message); } 
            finally { els.btnTestKey.disabled = false; els.btnTestKey.textContent = "測試連線"; }
        });
        els.btnLoadDemo.addEventListener('click', () => {
            if(state.wordList.length > 0) return;
            // Generate 30 demo words
            const demo = "apple\nbanana\ncat\ndog\nelephant\nfish\ngiraffe\nhat\nice\njump\nkite\nlion\nmonkey\nnest\norange\npig\nqueen\nrabbit\nsnake\ntiger\numbrella\nvan\nwhale\nxray\nyak\nzebra\nant\nbear\ncow\nduck";
            els.input.value = demo;
            handleInputUpdate();
        });

    </script>
</body>
</html>
