<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 單字卡生成器 (v4 參考表整合版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 z-10">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-database-zap"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 15 21.84"/><path d="M21 5V8"/><path d="M21 12L13 22L15 15L7 15L11 9"/></svg>
                AI 單字卡生成器 (v4 參考表版)
            </h1>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <span class="text-sm text-gray-500 whitespace-nowrap">API Key:</span>
                <input type="password" id="apiKeyInput" class="border border-gray-300 rounded px-2 py-1 text-sm flex-1 md:w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="sk-or-v1-...">
                <button id="btnTestKey" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2 py-1 rounded">測試連線</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto p-4 flex flex-col md:flex-row gap-4 overflow-hidden">
        
        <!-- Left Panel: Input & Controls -->
        <div class="w-full md:w-1/3 flex flex-col gap-4 bg-white p-4 rounded-lg shadow h-full overflow-y-auto">
            
            <!-- Reference File Upload Section (New) -->
            <div class="bg-indigo-50 p-3 rounded border border-indigo-100">
                <label class="block text-sm font-bold text-indigo-800 mb-1 flex justify-between">
                    <span>進階功能：參考字彙表</span>
                    <span id="refStatus" class="text-xs font-normal text-gray-500">未載入</span>
                </label>
                <input type="file" id="fileInput" accept=".json,.txt" class="block w-full text-xs text-gray-500
                  file:mr-2 file:py-1 file:px-2
                  file:rounded-full file:border-0
                  file:text-xs file:font-semibold
                  file:bg-indigo-100 file:text-indigo-700
                  hover:file:bg-indigo-200 mb-2
                "/>
                <button id="btnMergeWords" class="w-full text-xs bg-white border border-indigo-300 text-indigo-700 hover:bg-indigo-100 py-1 px-2 rounded hidden transition">
                    ➕ 自動加入檔案中未列出的單字
                </button>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">單字列表 (一行一個)</label>
                <textarea id="inputWords" class="w-full h-48 p-3 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono text-sm" placeholder="apple&#10;banana..."></textarea>
                <div class="flex justify-between mt-1">
                    <button id="btnLoadDemo" class="text-xs text-indigo-500 hover:underline">載入範例</button>
                    <p class="text-xs text-gray-500">已輸入: <span id="inputCount">0</span> 個單字</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="btnStart" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition flex items-center justify-center gap-2">
                    <span id="btnStartIcon">▶</span> <span id="btnStartText">開始生成</span>
                </button>
                <button id="btnPause" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 px-4 rounded transition hidden">
                    暫停
                </button>
                <button id="btnClear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded transition">
                    清除重置
                </button>
            </div>

            <div id="statusBox" class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded hidden transition-all">
                <p class="text-sm text-blue-700 font-medium break-words" id="statusText">準備就緒</p>
            </div>

            <hr class="border-gray-200">

            <div class="flex flex-col gap-2">
                 <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-700">進度</span>
                    <span class="text-xs text-gray-500" id="progressText">0 / 0</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                    <div id="progressBar" class="bg-green-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                 <p class="text-xs text-gray-500 text-right" id="estimatedTime">剩餘時間: 計算中...</p>
            </div>

             <div class="mt-auto pt-4">
                <button id="btnDownload" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2 px-4 rounded flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    下載 JSON 結果
                </button>
            </div>
        </div>

        <!-- Right Panel: Results Preview -->
        <div class="w-full md:w-2/3 flex flex-col bg-white rounded-lg shadow h-full overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold text-gray-700">生成結果預覽</h2>
                <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded-full" id="resultCountBadge">0 筆資料</span>
            </div>
            <div class="flex-1 overflow-auto p-4" id="resultsContainer">
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mb-2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                    <p>尚未生成任何資料</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Configuration ---
        const CONFIG = {
            localStorageKey: 'vocab_generator_state_v4',
            models: [
                'xiaomi/mimo-v2-flash:free',
                'mistralai/devstral-2512:free',
                'nvidia/nemotron-3-nano-30b-a3b:free'
            ],
            apiEndpoint: 'https://openrouter.ai/api/v1/chat/completions',
            siteUrl: 'http://localhost', 
            siteName: 'VocabGenLocal'
        };

        let state = {
            inputRaw: '',
            wordList: [],
            processedData: [], 
            currentIndex: 0,
            isProcessing: false,
            averageTimePerWord: 0
        };

        // Dictionary Map (Not saved to localStorage due to size)
        let referenceDictionary = new Map(); 

        // --- DOM Elements ---
        const els = {
            input: document.getElementById('inputWords'),
            inputCount: document.getElementById('inputCount'),
            apiKey: document.getElementById('apiKeyInput'),
            fileInput: document.getElementById('fileInput'),
            refStatus: document.getElementById('refStatus'),
            btnMergeWords: document.getElementById('btnMergeWords'),
            btnStart: document.getElementById('btnStart'),
            btnStartText: document.getElementById('btnStartText'),
            btnStartIcon: document.getElementById('btnStartIcon'),
            btnPause: document.getElementById('btnPause'),
            btnClear: document.getElementById('btnClear'),
            btnDownload: document.getElementById('btnDownload'),
            btnTestKey: document.getElementById('btnTestKey'),
            btnLoadDemo: document.getElementById('btnLoadDemo'),
            statusBox: document.getElementById('statusBox'),
            statusText: document.getElementById('statusText'),
            progressBar: document.getElementById('progressBar'),
            progressText: document.getElementById('progressText'),
            estimatedTime: document.getElementById('estimatedTime'),
            resultsContainer: document.getElementById('resultsContainer'),
            emptyState: document.getElementById('emptyState'),
            resultCountBadge: document.getElementById('resultCountBadge')
        };

        // --- Initialization ---
        window.onload = () => {
            loadState();
            updateUI();
            els.input.addEventListener('input', handleInputUpdate);
        };

        function handleInputUpdate() {
            const raw = els.input.value;
            const words = raw.split('\n').map(w => w.trim()).filter(w => w);
            els.inputCount.textContent = words.length;
            
            if (!state.isProcessing) {
                state.inputRaw = raw;
                if (state.currentIndex === 0) {
                     state.wordList = words;
                }
            }
        }

        // --- Reference File Handling ---
        els.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    processReferenceJSON(json);
                } catch (err) {
                    alert("檔案格式錯誤，必須是有效的 JSON 格式。");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        });

        function processReferenceJSON(jsonArray) {
            if (!Array.isArray(jsonArray)) {
                alert("JSON 格式錯誤：根目錄必須是陣列 []");
                return;
            }

            referenceDictionary.clear();
            let count = 0;

            // Structure check based on user prompt: { "字彙": "a", "級數": "初級" ... }
            jsonArray.forEach(item => {
                if (item["字彙"] && item["級數"]) {
                    // Store lowercase key for case-insensitive lookup
                    referenceDictionary.set(item["字彙"].toLowerCase().trim(), item["級數"].trim());
                    count++;
                }
            });

            els.refStatus.textContent = `已載入 ${count} 個單字`;
            els.refStatus.className = "text-xs font-bold text-green-600";
            
            if (count > 0) {
                els.btnMergeWords.classList.remove('hidden');
                els.btnMergeWords.textContent = `➕ 自動加入檔案中未列出的單字`;
            }

            showStatus(`參考表載入成功，共 ${count} 筆資料。`, "text-green-700", "bg-green-50", "border-green-500");
        }

        els.btnMergeWords.addEventListener('click', () => {
            if (referenceDictionary.size === 0) return;
            if (state.isProcessing) {
                alert("生成中請勿修改列表");
                return;
            }

            const currentWordsSet = new Set(
                els.input.value.split('\n').map(w => w.trim().toLowerCase()).filter(w => w)
            );

            let addedCount = 0;
            let newWordsList = els.input.value.split('\n'); // Start with existing

            // Iterate reference and add if missing
            for (const [refWord, _] of referenceDictionary) {
                if (!currentWordsSet.has(refWord)) {
                    newWordsList.push(refWord);
                    addedCount++;
                }
            }

            if (addedCount > 0) {
                // Remove empty lines and join
                state.inputRaw = newWordsList.map(w => w.trim()).filter(w=>w).join('\n');
                els.input.value = state.inputRaw;
                handleInputUpdate();
                alert(`已自動加入 ${addedCount} 個新單字！`);
            } else {
                alert("所有參考表中的單字都已經在列表中了。");
            }
        });

        // --- Persistence ---
        function saveState() {
            try {
                localStorage.setItem(CONFIG.localStorageKey, JSON.stringify({
                    ...state,
                    apiKey: els.apiKey.value 
                }));
            } catch (e) {
                console.error("Save failed:", e);
            }
        }

        function loadState() {
            const saved = localStorage.getItem(CONFIG.localStorageKey);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if(parsed.apiKey) els.apiKey.value = parsed.apiKey;
                    state = { ...state, ...parsed };
                    
                    els.input.value = state.inputRaw || '';
                    handleInputUpdate();
                    renderAllResults();
                    
                    state.isProcessing = false;
                } catch (e) {
                    console.error("Load failed:", e);
                }
            }
        }

        function clearState() {
            if(confirm("確定要清除所有進度和資料嗎？")) {
                localStorage.removeItem(CONFIG.localStorageKey);
                location.reload(); 
            }
        }

        // --- API & Logic ---
        
        async function testKey() {
            const apiKey = els.apiKey.value.trim();
            if(!apiKey) { alert("請先輸入 API Key"); return; }
            els.btnTestKey.textContent = "測試中...";
            els.btnTestKey.disabled = true;
            try {
                await fetchWordDataSingle("test", apiKey, CONFIG.models[0]);
                alert("API Key 測試成功！");
                showStatus("API Key 驗證成功", "text-green-700", "bg-green-50", "border-green-500");
                saveState();
            } catch (e) {
                alert(`測試失敗: ${e.message}`);
            } finally {
                els.btnTestKey.textContent = "測試連線";
                els.btnTestKey.disabled = false;
            }
        }

        async function startProcessing() {
            if (state.currentIndex === 0) {
                const words = els.input.value.split('\n').map(w => w.trim()).filter(w => w);
                if (words.length === 0) {
                    alert("請先輸入單字列表！");
                    return;
                }
                state.wordList = words;
                state.inputRaw = els.input.value;
            }

            const apiKey = els.apiKey.value.trim();
            if (!apiKey) {
                alert("請輸入 API Key");
                return;
            }

            state.isProcessing = true;
            updateUI();
            processNextWord();
        }

        function pauseProcessing() {
            state.isProcessing = false;
            updateUI();
            showStatus("已暫停", "text-yellow-700", "bg-yellow-50", "border-yellow-500");
        }

        async function processNextWord() {
            if (!state.isProcessing) return;

            if (state.currentIndex >= state.wordList.length) {
                finishProcessing();
                return;
            }

            const word = state.wordList[state.currentIndex];
            const apiKey = els.apiKey.value.trim();
            const startTime = Date.now();

            try {
                // 1. Fetch AI Data
                const data = await fetchWordDataWithFallback(word, apiKey);
                
                // 2. Inject Category from Reference File
                const refLevel = referenceDictionary.get(word.toLowerCase().trim());
                if (refLevel) {
                    data.category = `全民英檢(${refLevel})`;
                } else {
                    data.category = "無";
                }

                state.processedData.push(data);
                renderSingleResult(data, true);
                
                const duration = Date.now() - startTime;
                updateStats(duration);

                state.currentIndex++;
                saveState();
                updateUI();

                setTimeout(processNextWord, 1000);

            } catch (error) {
                console.error(error);
                state.isProcessing = false;
                updateUI();
                
                if (error.message.includes("401")) {
                     alert("API Key 無效 (401 User not found)。請檢查 Key。");
                     showStatus(`API Key 錯誤: 401`, "text-red-700", "bg-red-50", "border-red-500");
                } else {
                     showStatus(`錯誤 "${word}": ${error.message}`, "text-red-700", "bg-red-50", "border-red-500");
                }
            }
        }

        async function fetchWordDataWithFallback(word, apiKey) {
            let lastError = null;

            for (let i = 0; i < CONFIG.models.length; i++) {
                const modelName = CONFIG.models[i];
                const displayModel = modelName.split('/')[1];
                
                showStatus(
                    `處理中 (${state.currentIndex + 1}/${state.wordList.length}): ${word} [${displayModel}]`, 
                    "text-indigo-700", "bg-indigo-50", "border-indigo-500"
                );

                try {
                    return await fetchWordDataSingle(word, apiKey, modelName);
                } catch (e) {
                    console.warn(`Model ${modelName} failed:`, e);
                    lastError = e;
                    if (e.message.includes("401")) throw e; 
                }
            }
            throw new Error(`所有模型皆失敗: ${lastError ? lastError.message : '未知'}`);
        }

        async function fetchWordDataSingle(word, apiKey, model) {
            const prompt = `
            Analyze word: "${word}". Output JSON only.
            Format:
            {
                "word": "${word}",
                "part_of_speech": "String",
                "definition_zh": "Traditional Chinese definition",
                "example_en": "English sentence",
                "example_zh": "Chinese translation",
                "special_usage": "Special usage or '無'"
            }
            `;

            const response = await fetch(CONFIG.apiEndpoint, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': CONFIG.siteUrl,
                    'X-Title': CONFIG.siteName,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: "system", content: "You are a JSON dictionary bot. No markdown." },
                        { role: "user", content: prompt }
                    ]
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                if (response.status === 401) throw new Error(`API Status 401: User not found`);
                throw new Error(`API Status ${response.status}: ${errText.substring(0, 50)}`);
            }

            const result = await response.json();
            if (!result.choices || !result.choices[0]) throw new Error("Invalid structure");

            let content = result.choices[0].message.content;
            content = content.replace(/```json/g, '').replace(/```/g, '').trim();
            
            try {
                return JSON.parse(content);
            } catch (e) {
                throw new Error("JSON Parse Fail");
            }
        }

        // --- Helpers ---
        function finishProcessing() {
            state.isProcessing = false;
            updateUI();
            showStatus("完成！", "text-green-700", "bg-green-50", "border-green-500");
            saveState();
        }

        function updateUI() {
            const total = state.wordList.length || 0;
            const current = state.currentIndex;
            const percent = total === 0 ? 0 : Math.round((current / total) * 100);

            els.progressBar.style.width = `${percent}%`;
            els.progressText.textContent = `${current} / ${total} (${percent}%)`;
            els.resultCountBadge.textContent = `${state.processedData.length} 筆`;

            if (state.isProcessing) {
                els.btnStart.classList.add('hidden');
                els.btnPause.classList.remove('hidden');
                els.input.disabled = true;
                els.apiKey.disabled = true;
                els.fileInput.disabled = true;
            } else {
                els.btnStart.classList.remove('hidden');
                els.btnPause.classList.add('hidden');
                
                if (current > 0 && current < total) {
                    els.btnStartText.textContent = "繼續生成";
                    els.btnStartIcon.textContent = "⏯";
                } else if (current === total && total > 0) {
                     els.btnStartText.textContent = "重新生成 (需清除)";
                     els.btnStart.disabled = true;
                     els.btnStart.classList.add('opacity-50');
                } else {
                    els.btnStartText.textContent = "開始生成";
                    els.btnStartIcon.textContent = "▶";
                     els.btnStart.disabled = false;
                     els.btnStart.classList.remove('opacity-50');
                }
                
                els.input.disabled = (current > 0); 
                els.apiKey.disabled = false;
                els.fileInput.disabled = false;
            }

            els.btnDownload.disabled = state.processedData.length === 0;

            if (state.processedData.length > 0) els.emptyState.classList.add('hidden');
            else {
                els.emptyState.classList.remove('hidden');
                els.resultsContainer.innerHTML = '';
                els.resultsContainer.appendChild(els.emptyState);
            }
        }

        function updateStats(lastDuration) {
            if (state.averageTimePerWord === 0) state.averageTimePerWord = lastDuration;
            else state.averageTimePerWord = (state.averageTimePerWord * 0.7) + (lastDuration * 0.3);

            const remaining = state.wordList.length - state.currentIndex;
            const timeLeftMs = remaining * state.averageTimePerWord;
            els.estimatedTime.textContent = `剩餘約: ${Math.ceil(timeLeftMs / 1000)} 秒`;
        }

        function showStatus(msg, text, bg, border) {
            els.statusBox.classList.remove('hidden');
            els.statusBox.className = `border-l-4 p-3 rounded mb-2 ${bg} ${border}`;
            els.statusText.className = `text-sm font-medium ${text}`;
            els.statusText.textContent = msg;
        }

        function renderAllResults() {
            els.resultsContainer.innerHTML = '';
            els.resultsContainer.appendChild(els.emptyState);
            [...state.processedData].reverse().forEach(data => renderSingleResult(data, false));
        }

        function renderSingleResult(data, animate) {
            if (!els.emptyState.classList.contains('hidden')) els.emptyState.classList.add('hidden');
            
            const div = document.createElement('div');
            div.className = "bg-white border border-gray-200 rounded p-4 mb-3 shadow-sm text-sm relative group";
            if(animate) {
                div.classList.add('animate-pulse');
                setTimeout(()=>div.classList.remove('animate-pulse'), 500);
            }
            
            // Category Badge Logic
            let catBadge = '';
            if (data.category && data.category !== '無') {
                catBadge = `<span class="absolute top-4 right-4 bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-bold border border-green-200 shadow-sm">${data.category}</span>`;
            }

            div.innerHTML = `
                ${catBadge}
                <div class="font-bold text-indigo-700 text-lg flex items-center gap-2">
                    ${data.word} 
                    <span class="text-xs font-normal text-gray-500 bg-gray-100 px-1 rounded">${data.part_of_speech}</span>
                </div>
                <div class="text-gray-800 font-medium mb-2 pr-16">${data.definition_zh}</div>
                <div class="bg-gray-50 p-2 border-l-2 border-indigo-200 text-gray-600 italic">"${data.example_en}"</div>
                <div class="pl-2 text-gray-400 text-xs mt-1 mb-2">${data.example_zh}</div>
                ${data.special_usage && data.special_usage !== '無' ? `<div class="text-xs text-orange-600 bg-orange-50 px-2 py-1 rounded inline-block">用法: ${data.special_usage}</div>` : ''}
            `;
            els.resultsContainer.insertBefore(div, els.resultsContainer.firstChild);
        }

        function downloadJSON() {
            const blob = new Blob([JSON.stringify(state.processedData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `vocab_${new Date().getTime()}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        // Listeners
        els.btnStart.addEventListener('click', startProcessing);
        els.btnPause.addEventListener('click', pauseProcessing);
        els.btnClear.addEventListener('click', clearState);
        els.btnDownload.addEventListener('click', downloadJSON);
        els.btnTestKey.addEventListener('click', testKey);
        els.btnLoadDemo.addEventListener('click', () => {
            if(state.currentIndex > 0) return;
            els.input.value = "serendipity\nephemeral\napple\nzinc";
            handleInputUpdate();
        });

    </script>
</body>
</html>
