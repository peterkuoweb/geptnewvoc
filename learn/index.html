<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>單字帆船 Word Sail</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuaguuWtlzxl0iIsCiAgInNob3J0X25hbWUiOiAiV29yZFNhaWwiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzRmNDZlNSIsCiAgInRoZW1lX2NvbG9yIjogIiM0ZjQ2ZTUiLAogICJpY29ucyI6IFtdCn0=">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script>MobileDragDrop.polyfill({dragImageCenterOnTouch: true});</script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700&800&display=swap');
        :root { --app-height: 100dvh; }
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            height: var(--app-height);
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1);
        }

        /* Input Styles */
        .input-pill-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 100%;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 9999px;
            padding: 0.75rem 1.25rem;
            transition: all 0.2s;
        }
        .input-pill-container:focus-within {
            border-color: #6366f1;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        .input-icon-left {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-right: 0.75rem;
            min-width: 24px;
            text-align: center;
        }
        .input-pill-container:focus-within .input-icon-left { color: #6366f1; }
        .input-field-clean {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-weight: 600;
            color: #334155;
            font-size: 1rem;
            width: 100%;
        }
        
        /* Buttons */
        .btn-pill-primary {
            width: 100%; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white; font-weight: 800; padding: 1rem; border-radius: 9999px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-pill-primary:active { transform: scale(0.97); }
        .btn-pill-secondary {
            width: 100%; display: flex; justify-content: center; align-items: center;
            background: white; color: #64748b; font-weight: 700; padding: 1rem;
            border-radius: 9999px; border: 2px solid #e2e8f0; transition: all 0.2s;
        }
        .btn-pill-secondary:active { background-color: #f1f5f9; transform: scale(0.97); }

        /* Background & Animations */
        .bg-animated {
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* Utilities */
        #loading-overlay { z-index: 9999; }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Toggle */
        .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
        .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="relative mb-6">
        <div class="w-20 h-20 border-4 border-slate-100 border-t-indigo-500 rounded-full animate-spin"></div>
        <i class="fas fa-sailboat absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-indigo-500 text-2xl"></i>
    </div>
    <p id="loading-text" class="text-slate-500 font-bold text-sm tracking-widest animate-pulse">啟航中...</p>
</div>

<!-- Announcement Modal -->
<div id="announcement-modal" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-6">
    <div class="glass-panel rounded-3xl shadow-2xl max-w-sm w-full p-6 animate-fade-in relative overflow-hidden bg-white">
        <div class="text-center mb-6 mt-2">
            <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-500 text-3xl rotate-6">
                <i class="fas fa-bullhorn"></i>
            </div>
            <h3 class="text-xl font-extrabold text-slate-800">航海公告</h3>
        </div>
        <div id="announcement-text" class="text-slate-600 mb-8 text-center leading-relaxed whitespace-pre-wrap font-medium"></div>
        <button onclick="closeAnnouncement()" class="btn-pill-primary">收到！</button>
    </div>
</div>

<!-- Main App Container -->
<div id="app" class="h-full w-full relative"></div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbyR_aKVkSoHuBnpBj_7EPQzB1HGbvQyH7yIsFTYnCIfniVWwYA0RC3d-8RgZvQd5M4aJg/exec";
const DB_URL = './allvoc.json';

const state = {
    user: null, 
    isLoggedIn: false,
    activeTab: 'learn',
    vocabulary: [],
    progress: {}, 
    session: { queue: [], currentIndex: 0, mode: 'card', reviewQueue: [], currentSentenceMistakes: 0 },
    remoteSettings: { announcement: "0", lotteryPoints: [10, 20, 50, 100] },
    tempBook: { id: null, name: "", words: [] } // For editing
};

const sounds = {
    correct: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3'),
    wrong: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'),
    complete: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'),
    spin: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-game-level-music-689.mp3') 
};

// --- Core Functions ---

async function initApp() {
    const savedUser = localStorage.getItem('wv_user_v10'); // Version bump
    
    try {
        const response = await fetch(DB_URL);
        state.vocabulary = await response.json();
    } catch (e) {
        state.vocabulary = [];
    }

    const setAppHeight = () => document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    window.addEventListener('resize', setAppHeight);
    setAppHeight();

    // Fetch settings
    fetch(`${API_URL}?action=getSettings`).then(r=>r.json()).then(d=>{
        if(d.Announcement) state.remoteSettings.announcement = String(d.Announcement);
        if(d.LotteryPoints) state.remoteSettings.lotteryPoints = String(d.LotteryPoints).split(',').map(Number);
    }).catch(e=>{});

    // Auto Login
    if (savedUser) {
        try {
            const localUser = JSON.parse(savedUser);
            if(!localUser.settings) localUser.settings = { notifications: false, notificationTime: "20:00", speechRate: 1.0 };
            await loginUser(localUser.nickname, localUser.password, true);
        } catch(e) {
            setLoading(false); renderLogin();
        }
    } else {
        setLoading(false); renderLogin();
    }
}

function setLoading(isLoading, text = "載入中...") {
    const el = document.getElementById('loading-overlay');
    const txt = document.getElementById('loading-text');
    if (isLoading) {
        el.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        if (txt) txt.innerText = text;
    } else {
        el.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => { el.classList.add('hidden'); }, 300);
    }
}

// --- AUTH UI ---

function renderLogin() {
    document.getElementById('app').innerHTML = `
        <div class="h-full w-full bg-animated flex flex-col items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] animate-fade-in shadow-xl flex flex-col items-center relative">
                <div class="mb-8 flex flex-col items-center">
                    <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 text-indigo-500 text-4xl border-4 border-indigo-50"><i class="fas fa-sailboat"></i></div>
                    <h1 class="text-3xl font-extrabold text-slate-800">單字帆船</h1>
                    <p class="text-slate-400 font-bold text-xs tracking-widest mt-1">WORD SAIL</p>
                </div>
                <p id="login-error" class="text-red-500 text-sm font-bold mb-4 h-5"></p>
                <div class="w-full space-y-4">
                    <div class="input-pill-container"><i class="fas fa-user input-icon-left"></i><input type="text" id="login-nick" placeholder="帳號 或 Email" class="input-field-clean" oninput="clearError()"></div>
                    <div class="input-pill-container"><i class="fas fa-lock input-icon-left"></i><input type="password" id="login-pass" placeholder="密碼" class="input-field-clean" oninput="clearError()"></div>
                    <button id="btn-login" onclick="handleLoginClick()" class="btn-pill-primary mt-6">登入</button>
                    <div class="relative py-3"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div><div class="relative flex justify-center text-xs uppercase"><span class="bg-white/80 px-3 text-slate-400 font-bold rounded-full">OR</span></div></div>
                    <button onclick="renderRegister()" class="btn-pill-secondary">註冊新帳號</button>
                </div>
            </div>
            <div class="mt-8 text-indigo-900/40 text-xs font-bold tracking-widest">V10.0 Cloud Sync</div>
        </div>`;
}

function renderRegister() {
    document.getElementById('app').innerHTML = `
        <div class="h-full w-full bg-slate-50 flex flex-col items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] animate-fade-in shadow-xl flex flex-col items-center bg-white border-0">
                <button onclick="renderLogin()" class="self-start text-slate-400 mb-6 hover:text-indigo-600 transition flex items-center font-bold text-sm bg-slate-100 px-4 py-2 rounded-full"><i class="fas fa-arrow-left mr-2"></i> 返回</button>
                <h1 class="text-2xl font-extrabold text-slate-800 mb-2">建立帳號</h1>
                <p class="text-slate-400 text-sm mb-6 font-medium">資料將同步至雲端，隨時隨地學習</p>
                <p id="reg-error" class="text-red-500 text-sm font-bold mb-4 h-5 text-center"></p>
                <div class="w-full space-y-3">
                    <div class="input-pill-container"><i class="fas fa-envelope input-icon-left"></i><input type="email" id="reg-email" placeholder="電子郵件" class="input-field-clean" oninput="clearRegError()"></div>
                    <div class="input-pill-container"><i class="fas fa-user input-icon-left"></i><input type="text" id="reg-nick" placeholder="設定帳號 (英文數字)" class="input-field-clean" oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'');clearRegError()"></div>
                    <div class="input-pill-container"><i class="fas fa-key input-icon-left"></i><input type="password" id="reg-pass" placeholder="設定密碼" class="input-field-clean" oninput="clearRegError()"></div>
                    <button id="btn-reg" onclick="handleRegisterClick()" class="btn-pill-primary bg-indigo-600 mt-6 shadow-indigo-200">註冊並登入</button>
                </div>
            </div>
        </div>`;
}

function clearError() { document.getElementById('login-error').innerText = ""; }
function clearRegError() { document.getElementById('reg-error').innerText = ""; }

// --- AUTH LOGIC ---

async function handleLoginClick() {
    const nick = document.getElementById('login-nick').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    if(!nick || !pass) return document.getElementById('login-error').innerText = "請輸入帳號和密碼";
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 登入中...';
    try { await loginUser(nick, pass, false); } catch(e) { btn.disabled = false; btn.innerHTML = '登入'; document.getElementById('login-error').innerText = e.message; }
}

async function handleRegisterClick() {
    const email = document.getElementById('reg-email').value.trim();
    const nick = document.getElementById('reg-nick').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    if(!email || !nick || !pass) return document.getElementById('reg-error').innerText = "所有欄位皆為必填";
    const btn = document.getElementById('btn-reg');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 建立中...';
    try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'register', nickname: nick, password: pass, email: email }) });
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        await loginUser(nick, pass, false, true); 
    } catch(e) { btn.disabled = false; btn.innerHTML = '註冊並登入'; document.getElementById('reg-error').innerText = e.message; }
}

async function loginUser(nick, pass, isAuto, isFirstTime = false) {
    try {
        if(!isAuto) setLoading(true, "正在登入雲端...");
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nickname: nick, password: pass }) });
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        state.user = {
            nickname: data.nickname, email: data.email, password: pass,
            totalLearned: parseInt(data.totalLearned)||0, streak: parseInt(data.streak)||1, points: parseInt(data.points)||0,
            currentBook: data.currentBook || null, customBooks: Array.isArray(data.customBooks) ? data.customBooks : [],
            settings: state.user?.settings || { notifications: false, notificationTime: "20:00", speechRate: 1.0 }
        };
        state.progress = data.progress || {};
        state.customBooks = state.user.customBooks;
        state.isLoggedIn = true;
        saveState();
        
        if(isAuto) { render(); setLoading(false); }
        else {
            setLoading(false);
            if(isFirstTime || !state.user.currentBook) renderInitialBookSelection(document.getElementById('app'));
            else { render(); checkAnnouncement(); }
        }
        return true;
    } catch(e) { setLoading(false); if(isAuto) renderLogin(); else throw e; }
}

// --- BOOK SELECTION ---

function renderInitialBookSelection(c) {
    c.innerHTML = `
        <div class="h-full bg-slate-50 flex flex-col p-6 animate-fade-in items-center justify-center">
            <div class="w-full max-w-md bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col h-[80vh]">
                <div class="text-center mb-6 mt-4">
                    <div class="w-20 h-20 bg-indigo-100 rounded-3xl flex items-center justify-center mx-auto mb-4 text-indigo-600 text-4xl animate-bounce"><i class="fas fa-book-open"></i></div>
                    <h1 class="text-2xl font-bold text-slate-800">選擇第一本教材</h1>
                    <p class="text-slate-400 text-sm mt-1 font-medium">這將會同步到您的雲端帳號</p>
                </div>
                <div class="flex-1 overflow-y-auto pb-4 px-1 space-y-3">
                    ${renderSelectableBook('GEPT_Elem', '全民英檢 初級', 'bg-green-500')}
                    ${renderSelectableBook('GEPT_Inter', '全民英檢 中級', 'bg-blue-500')}
                    ${renderSelectableBook('GEPT_High', '全民英檢 中高級', 'bg-purple-500')}
                    ${renderSelectableBook('Custom_World', '單字環遊世界', 'bg-pink-500')}
                </div>
            </div>
        </div>`;
}
function renderSelectableBook(id, name, color) {
    return `<button onclick="handleFirstBookSelect('${id}')" class="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 flex items-center space-x-4 active:scale-95 transition-all text-left hover:border-indigo-500 hover:bg-white hover:shadow-md group"><div class="w-12 h-12 rounded-xl ${color} text-white flex items-center justify-center text-xl shadow-sm group-hover:scale-110 transition-transform"><i class="fas fa-book"></i></div><div><div class="font-bold text-slate-800 text-lg">${name}</div><div class="text-xs text-slate-400 font-bold">點擊開始學習</div></div></button>`;
}
function handleFirstBookSelect(id) { state.user.currentBook = id; saveState(); render(); checkAnnouncement(); }

// --- MAIN LAYOUT ---

function render() {
    const app = document.getElementById('app');
    if (!state.isLoggedIn) return renderLogin();
    if (!state.user.currentBook) return renderInitialBookSelection(app);
    app.innerHTML = `
        <div class="flex flex-col h-full bg-slate-50 w-full">
            <div id="main-content" class="content-area relative w-full overflow-hidden"></div>
            <div class="absolute bottom-0 left-0 w-full h-[85px] bg-white border-t border-slate-200 flex justify-around items-center pb-safe z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.03)]">
                ${renderNavItem('learn', '背單字', 'fa-brain')}
                ${renderNavItem('books', '選擇教材', 'fa-book-open')}
                ${renderNavItem('profile', '個人檔案', 'fa-user-astronaut')}
            </div>
        </div>`;
    renderActiveTab();
}
function renderNavItem(id, l, i) {
    const act = state.activeTab === id;
    return `<button onclick="state.activeTab='${id}';render()" class="flex flex-col items-center justify-center w-full h-full space-y-1 group"><div class="px-5 py-1.5 rounded-full ${act?'bg-indigo-50 scale-110':'scale-100'} transition-all duration-300"><i class="fas ${i} text-xl ${act?'text-indigo-600':'text-slate-400'} transition-colors"></i></div><span class="text-[10px] font-bold ${act?'text-indigo-600':'text-slate-400'}">${l}</span></button>`;
}
function renderActiveTab() {
    const content = document.getElementById('main-content');
    if (state.activeTab === 'learn') renderLearnTab(content);
    else if (state.activeTab === 'books') renderMaterialsTab(content);
    else if (state.activeTab === 'profile') renderProfileTab(content);
}

// --- BOOK EDITOR (NEW) ---

function openBookEditor(bookId) {
    // Determine edit or new
    if (bookId) {
        const book = state.customBooks.find(b => b.id === bookId);
        state.tempBook = { id: book.id, name: book.name, words: [...book.words] }; // Clone
    } else {
        state.tempBook = { id: null, name: "", words: [] };
    }
    renderBookEditor();
}

function renderBookEditor() {
    const isNew = !state.tempBook.id;
    const content = document.getElementById('main-content');
    content.innerHTML = `
        <div class="h-full bg-slate-50 flex flex-col z-50 absolute inset-0 animate-fade-in">
            <!-- Header -->
            <div class="bg-white p-4 flex items-center justify-between border-b border-slate-200 shadow-sm sticky top-0 z-10">
                <button onclick="renderMaterialsTab(document.getElementById('main-content'))" class="text-slate-500 font-bold text-sm"><i class="fas fa-times mr-1"></i> 取消</button>
                <h2 class="font-extrabold text-slate-800">${isNew ? '建立單字書' : '編輯單字書'}</h2>
                <button onclick="saveBook()" class="text-indigo-600 font-bold text-sm">儲存 <i class="fas fa-check"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-5 space-y-6">
                <!-- Name Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">書名</label>
                    <div class="input-pill-container bg-white">
                        <input type="text" id="book-name" value="${state.tempBook.name}" placeholder="例如：我的易錯單字" class="input-field-clean" oninput="state.tempBook.name=this.value">
                    </div>
                </div>

                <!-- Word Search -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">加入單字</label>
                    <div class="input-pill-container bg-white mb-2">
                        <i class="fas fa-search input-icon-left"></i>
                        <input type="text" id="word-search" placeholder="搜尋系統單字庫..." class="input-field-clean" oninput="handleSearch(this.value)">
                    </div>
                    <!-- Search Results -->
                    <div id="search-results" class="hidden bg-white rounded-2xl shadow-lg border border-slate-100 max-h-48 overflow-y-auto mb-4"></div>
                </div>

                <!-- Added Words List -->
                <div>
                    <div class="flex justify-between items-end mb-2 ml-1">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">已選單字 (${state.tempBook.words.length})</label>
                        ${state.tempBook.words.length>0 ? '<button onclick="clearAllWords()" class="text-xs text-red-400 font-bold">清空</button>' : ''}
                    </div>
                    
                    <div class="flex flex-wrap gap-2">
                        ${state.tempBook.words.length === 0 
                            ? '<div class="w-full text-center p-8 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 text-sm">還沒有加入任何單字</div>' 
                            : state.tempBook.words.map(w => `
                                <span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-bold bg-indigo-50 text-indigo-600 border border-indigo-100">
                                    ${w}
                                    <button onclick="removeWord('${w}')" class="ml-2 text-indigo-400 hover:text-red-500"><i class="fas fa-times"></i></button>
                                </span>
                            `).join('')
                        }
                    </div>
                </div>
            </div>
        </div>
    `;
}

function handleSearch(query) {
    const resultsDiv = document.getElementById('search-results');
    if (!query) { resultsDiv.classList.add('hidden'); return; }
    
    const q = query.toLowerCase();
    // Filter words not already in book
    const matches = state.vocabulary.filter(v => 
        (v.word.toLowerCase().includes(q) || v.definition_zh.includes(q)) && 
        !state.tempBook.words.includes(v.word)
    ).slice(0, 10); // Limit 10

    if (matches.length > 0) {
        resultsDiv.innerHTML = matches.map(m => `
            <button onclick="addWord('${m.word}')" class="w-full text-left px-4 py-3 border-b border-slate-50 hover:bg-slate-50 flex justify-between items-center last:border-0">
                <div>
                    <div class="font-bold text-slate-700">${m.word}</div>
                    <div class="text-xs text-slate-400">${m.definition_zh}</div>
                </div>
                <i class="fas fa-plus text-indigo-500 bg-indigo-50 rounded-full w-6 h-6 flex items-center justify-center text-xs"></i>
            </button>
        `).join('');
        resultsDiv.classList.remove('hidden');
    } else {
        resultsDiv.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">找不到相關單字</div>';
        resultsDiv.classList.remove('hidden');
    }
}

function addWord(word) {
    state.tempBook.words.push(word);
    document.getElementById('word-search').value = '';
    document.getElementById('search-results').classList.add('hidden');
    renderBookEditor(); // Re-render to update list
}

function removeWord(word) {
    state.tempBook.words = state.tempBook.words.filter(w => w !== word);
    renderBookEditor();
}

function clearAllWords() {
    if(confirm("確定清空所有已選單字？")) {
        state.tempBook.words = [];
        renderBookEditor();
    }
}

function saveBook() {
    const name = state.tempBook.name.trim();
    if (!name) return alert("請輸入單字書名稱");
    if (state.tempBook.words.length === 0) return alert("請至少加入一個單字");

    if (state.tempBook.id) {
        // Edit existing
        const idx = state.customBooks.findIndex(b => b.id === state.tempBook.id);
        if (idx > -1) state.customBooks[idx] = { ...state.tempBook };
    } else {
        // New
        state.customBooks.push({
            id: 'custom_' + Date.now(),
            name: name,
            words: state.tempBook.words
        });
    }
    
    saveState();
    renderMaterialsTab(document.getElementById('main-content'));
}

function deleteBook(bookId) {
    if (!confirm("確定要刪除這本單字書嗎？無法復原。")) return;
    
    state.customBooks = state.customBooks.filter(b => b.id !== bookId);
    if (state.user.currentBook === bookId) state.user.currentBook = null; // Reset if current
    
    saveState();
    renderMaterialsTab(document.getElementById('main-content'));
}

function saveState() {
    if(!state.user) return;
    localStorage.setItem('wv_user_v10', JSON.stringify(state.user));
    
    // Sync Custom Books
    fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'sync',
            nickname: state.user.nickname,
            customBooks: state.customBooks, // This is crucial
            currentBook: state.user.currentBook || '',
            totalLearned: Object.keys(state.progress).length,
            streak: state.user.streak,
            points: state.user.points,
            progress: state.progress
        })
    }).catch(e => console.log("Bg Sync Fail"));
}

function handleBookSwitch(id) { state.user.currentBook = id; saveState(); render(); checkAnnouncement(); }
function getBookName(id) {
    if(id==='GEPT_Elem') return '全民英檢初級';
    if(id==='GEPT_Inter') return '全民英檢中級';
    if(id==='GEPT_High') return '全民英檢中高級';
    if(id==='Custom_World') return '單字環遊世界';
    const c = state.customBooks.find(b=>b.id===id);
    return c ? c.name : 'Unknown';
}

function renderLearnTab(c) {
    let words = [];
    const bookId = state.user.currentBook;
    if (bookId === 'GEPT_Elem') words = state.vocabulary.filter(w => w.category && w.category.includes('初級'));
    else if (bookId === 'GEPT_Inter') words = state.vocabulary.filter(w => w.category && w.category.includes('中級') && !w.category.includes('高級'));
    else if (bookId === 'GEPT_High') words = state.vocabulary.filter(w => w.category && w.category.includes('中高級'));
    else if (bookId === 'Custom_World') words = [...state.vocabulary];
    else {
        const customBook = state.customBooks.find(b => b.id === bookId);
        if (customBook) {
            // Filter valid words (in case vocabulary changed)
            words = state.vocabulary.filter(w => customBook.words.includes(w.word));
        }
    }
    const lessons = []; for (let i = 0; i < words.length; i += 7) lessons.push(words.slice(i, i + 7));

    let html = `
        <div class="p-5 pt-10 pb-28 space-y-5 animate-fade-in h-full overflow-y-auto">
            <h1 class="text-3xl font-extrabold text-slate-800 px-1">學習進度</h1>
            <div class="bg-indigo-600 rounded-[2rem] p-6 text-white shadow-xl shadow-indigo-200 relative overflow-hidden">

                <i class="fas fa-book-reader text-8xl text-white/10 absolute -right-4 -bottom-4 rotate-12"></i>
            </div>
            ${lessons.length===0 ? '<div class="text-center text-slate-400 mt-10 font-bold">這本書沒有單字<br>請先去編輯加入單字</div>' : ''}
            <div class="space-y-3 pb-8">
            ${lessons.map((l, i) => {
                const learned = l.filter(w => state.progress[w.word]?.status === 'learned').length;
                const isDone = learned === l.length;
                return `<div onclick="startLesson(${i})" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform cursor-pointer"><div class="flex items-center space-x-4 overflow-hidden"><div class="w-12 h-12 rounded-xl ${isDone?'bg-green-100 text-green-600':'bg-slate-100 text-slate-500'} flex items-center justify-center font-bold text-lg shrink-0 transition-colors">${isDone ? '<i class="fas fa-check"></i>' : i+1}</div><div class="min-w-0"><h3 class="font-bold text-slate-700 truncate text-lg">Lesson ${i+1}</h3><p class="text-xs text-slate-400 truncate w-40">${l.map(w=>w.word).join(', ')}</p></div></div><div class="text-xs font-bold ${isDone?'text-green-500':'text-slate-300'} bg-slate-50 px-2 py-1 rounded-lg">${learned}/${l.length}</div></div>`;
            }).join('')}
            </div>
        </div>`;
    c.innerHTML = html;
}

// ... Study Logic ...
function startLesson(idx) {
    // Re-fetch words logic...
    let words = [];
    const bookId = state.user.currentBook;
    if (bookId === 'GEPT_Elem') words = state.vocabulary.filter(w => w.category && w.category.includes('初級'));
    else if (bookId === 'GEPT_Inter') words = state.vocabulary.filter(w => w.category && w.category.includes('中級') && !w.category.includes('高級'));
    else if (bookId === 'GEPT_High') words = state.vocabulary.filter(w => w.category && w.category.includes('中高級'));
    else if (bookId === 'Custom_World') words = [...state.vocabulary];
    else { const cb = state.customBooks.find(b => b.id === bookId); if(cb) words = state.vocabulary.filter(w => cb.words.includes(w.word)); }
    
    const lessons = []; for (let i = 0; i < words.length; i += 7) lessons.push(words.slice(i, i + 7));
    state.session.queue = [...lessons[idx]]; state.session.currentIndex = 0; state.session.mode = 'card'; state.session.reviewQueue = [];
    renderStudyScreen();
}

function renderStudyScreen() {
    const w = state.session.queue[state.session.currentIndex];
    if(!w) { 
        // Mode logic (Simplified)
        if(state.session.mode==='card') { state.session.mode='review'; state.session.currentIndex=0; renderStudyScreen(); }
        else { renderLessonComplete(document.getElementById('main-content')); }
        return; 
    }
    // Simple Render for brevity (using updated Pill buttons)
    document.getElementById('main-content').innerHTML = `<div class="h-full flex flex-col justify-center items-center p-6 bg-slate-50"><div class="bg-white p-8 rounded-[2rem] shadow-xl text-center w-full max-w-md"><h2 class="text-4xl font-bold mb-4 text-indigo-600">${w.word}</h2><p class="text-xl font-bold text-slate-700">${w.definition_zh}</p></div><button onclick="nextStep()" class="btn-pill-primary mt-8 max-w-xs">Next</button></div>`;
}
function nextStep() { state.session.currentIndex++; renderStudyScreen(); }
function renderLessonComplete(c) { c.innerHTML = `<div class="h-full flex flex-col items-center justify-center"><h1 class="text-3xl font-bold">完成!</h1><button onclick="state.activeTab='learn';render()" class="btn-pill-primary mt-4 w-40">OK</button></div>`; }

function logout() { localStorage.removeItem('wv_user_v10'); state.user = null; state.isLoggedIn = false; renderLogin(); }
function checkAnnouncement() { if(state.remoteSettings.announcement !== "0") { document.getElementById('announcement-text').innerText = state.remoteSettings.announcement; document.getElementById('announcement-modal').classList.remove('hidden'); } }
function closeAnnouncement() { document.getElementById('announcement-modal').classList.add('hidden'); }
