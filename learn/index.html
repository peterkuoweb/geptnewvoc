<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>單字帆船 Word Sail</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuaguuWtlzxl0iIsCiAgInNob3J0X25hbWUiOiAiV29yZFNhaWwiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzRmNDZlNSIsCiAgInRoZW1lX2NvbG9yIjogIiM0ZjQ2ZTUiLAogICJpY29ucyI6IFtdCn0=">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script>MobileDragDrop.polyfill({dragImageCenterOnTouch: true});</script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700&800&display=swap');
        :root { --app-height: 100dvh; }
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            height: var(--app-height);
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1);
        }

        /* Inputs */
        .input-pill-container {
            display: flex; flex-direction: row; align-items: center; width: 100%;
            background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 9999px;
            padding: 0.75rem 1.25rem; transition: all 0.2s;
        }
        .input-pill-container:focus-within { border-color: #6366f1; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .input-icon-left { font-size: 1.25rem; color: #94a3b8; margin-right: 0.75rem; min-width: 24px; text-align: center; }
        .input-pill-container:focus-within .input-icon-left { color: #6366f1; }
        .input-field-clean { flex: 1; background: transparent; border: none; outline: none; font-weight: 600; color: #334155; font-size: 1rem; width: 100%; }
        
        /* Buttons */
        .btn-pill-primary {
            width: 100%; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white; font-weight: 800; padding: 1rem; border-radius: 9999px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3); transition: transform 0.1s;
        }
        .btn-pill-primary:active { transform: scale(0.97); }
        .btn-pill-secondary {
            width: 100%; display: flex; justify-content: center; align-items: center;
            background: white; color: #64748b; font-weight: 700; padding: 1rem;
            border-radius: 9999px; border: 2px solid #e2e8f0; transition: all 0.2s;
        }
        .btn-pill-secondary:active { background-color: #f1f5f9; transform: scale(0.97); }

        /* Animation */
        .bg-animated { background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%); background-size: 200% 200%; animation: gradient 15s ease infinite; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* Utilities */
        #loading-overlay { z-index: 9999; }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .draggable-word.dragging { opacity: 0.5; transform: scale(0.95); }
        
        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
        .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="relative mb-6">
        <div class="w-20 h-20 border-4 border-slate-100 border-t-indigo-500 rounded-full animate-spin"></div>
        <i class="fas fa-sailboat absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-indigo-500 text-2xl"></i>
    </div>
    <p id="loading-text" class="text-slate-500 font-bold text-sm tracking-widest animate-pulse">啟航中...</p>
</div>

<!-- Announcement -->
<div id="announcement-modal" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-6">
    <div class="glass-panel rounded-3xl shadow-2xl max-w-sm w-full p-6 animate-fade-in relative overflow-hidden bg-white">
        <div class="text-center mb-6 mt-2">
            <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-500 text-3xl rotate-6"><i class="fas fa-bullhorn"></i></div>
            <h3 class="text-xl font-extrabold text-slate-800">航海公告</h3>
        </div>
        <div id="announcement-text" class="text-slate-600 mb-8 text-center leading-relaxed whitespace-pre-wrap font-medium"></div>
        <button onclick="closeAnnouncement()" class="btn-pill-primary">收到！</button>
    </div>
</div>

<!-- App -->
<div id="app" class="h-full w-full relative"></div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbyR_aKVkSoHuBnpBj_7EPQzB1HGbvQyH7yIsFTYnCIfniVWwYA0RC3d-8RgZvQd5M4aJg/exec";
const DB_URL = './allvoc.json';

const state = {
    user: null, 
    isLoggedIn: false,
    activeTab: 'learn',
    vocabulary: [],
    progress: {}, 
    // New Session Structure
    session: { 
        originalQueue: [], // The lesson words
        reviewQueue: [],   // SRS review words
        failedQueue: [],   // Words rated red to retry
        currentPhase: 'preview', // preview, srs_check, flashcard, sentence, match, spell, rating, complete
        currentModeQueue: [], // The queue for the current phase (e.g. Flashcards)
        currentIndex: 0,
        currentSentenceMistakes: 0,
        isRetrying: false // Are we in the red loop?
    },
    remoteSettings: { announcement: "0", lotteryPoints: [10, 20, 50, 100] },
    tempBook: { id: null, name: "", words: [] } 
};

const sounds = {
    correct: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3'),
    wrong: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'),
    complete: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'),
    spin: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-game-level-music-689.mp3') 
};

// --- Init ---
async function initApp() {
    const savedUser = localStorage.getItem('wv_user_v11'); 
    
    try {
        const response = await fetch(DB_URL);
        state.vocabulary = await response.json();
    } catch (e) { state.vocabulary = []; }

    const setAppHeight = () => document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    window.addEventListener('resize', setAppHeight); setAppHeight();

    fetch(`${API_URL}?action=getSettings`).then(r=>r.json()).then(d=>{
        if(d.Announcement) state.remoteSettings.announcement = String(d.Announcement);
        if(d.LotteryPoints) state.remoteSettings.lotteryPoints = String(d.LotteryPoints).split(',').map(Number);
    }).catch(e=>{});

    if (savedUser) {
        try {
            const localUser = JSON.parse(savedUser);
            if(!localUser.settings) localUser.settings = { notifications: false, notificationTime: "20:00", speechRate: 1.0 };
            await loginUser(localUser.nickname, localUser.password, true);
        } catch(e) { setLoading(false); renderLogin(); }
    } else { setLoading(false); renderLogin(); }
}

function setLoading(isLoading, text = "載入中...") {
    const el = document.getElementById('loading-overlay');
    const txt = document.getElementById('loading-text');
    if (isLoading) {
        el.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        if (txt) txt.innerText = text;
    } else {
        el.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => { el.classList.add('hidden'); }, 300);
    }
}

// --- Auth UI ---
function renderLogin() {
    document.getElementById('app').innerHTML = `
        <div class="h-full w-full bg-animated flex flex-col items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] animate-fade-in shadow-xl flex flex-col items-center">
                <div class="mb-8 flex flex-col items-center">
                    <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 text-indigo-500 text-4xl border-4 border-indigo-50"><i class="fas fa-sailboat"></i></div>
                    <h1 class="text-3xl font-extrabold text-slate-800">單字帆船</h1>
                    <p class="text-slate-400 font-bold text-xs tracking-widest mt-1">WORD SAIL</p>
                </div>
                <p id="login-error" class="text-red-500 text-sm font-bold mb-4 h-5"></p>
                <div class="w-full space-y-4">
                    <div class="input-pill-container"><i class="fas fa-user input-icon-left"></i><input type="text" id="login-nick" placeholder="帳號 或 Email" class="input-field-clean" oninput="clearError()"></div>
                    <div class="input-pill-container"><i class="fas fa-lock input-icon-left"></i><input type="password" id="login-pass" placeholder="密碼" class="input-field-clean" oninput="clearError()"></div>
                    <button id="btn-login" onclick="handleLoginClick()" class="btn-pill-primary mt-6">登入</button>
                    <div class="relative py-3"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div><div class="relative flex justify-center text-xs uppercase"><span class="bg-white/80 px-3 text-slate-400 font-bold rounded-full">OR</span></div></div>
                    <button onclick="renderRegister()" class="btn-pill-secondary">註冊新帳號</button>
                </div>
            </div>
            <div class="mt-8 text-indigo-900/40 text-xs font-bold tracking-widest">V11.0</div>
        </div>`;
}

function renderRegister() {
    document.getElementById('app').innerHTML = `
        <div class="h-full w-full bg-slate-50 flex flex-col items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] animate-fade-in shadow-xl flex flex-col items-center bg-white border-0">
                <button onclick="renderLogin()" class="self-start text-slate-400 mb-6 hover:text-indigo-600 transition flex items-center font-bold text-sm bg-slate-100 px-4 py-2 rounded-full"><i class="fas fa-arrow-left mr-2"></i> 返回</button>
                <h1 class="text-2xl font-extrabold text-slate-800 mb-2">建立帳號</h1>
                <p class="text-slate-400 text-sm mb-6 font-medium">資料將同步至雲端</p>
                <p id="reg-error" class="text-red-500 text-sm font-bold mb-4 h-5 text-center"></p>
                <div class="w-full space-y-3">
                    <div class="input-pill-container"><i class="fas fa-envelope input-icon-left"></i><input type="email" id="reg-email" placeholder="電子郵件" class="input-field-clean" oninput="clearRegError()"></div>
                    <div class="input-pill-container"><i class="fas fa-user input-icon-left"></i><input type="text" id="reg-nick" placeholder="設定帳號" class="input-field-clean" oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'');clearRegError()"></div>
                    <div class="input-pill-container"><i class="fas fa-key input-icon-left"></i><input type="password" id="reg-pass" placeholder="設定密碼" class="input-field-clean" oninput="clearRegError()"></div>
                    <button id="btn-reg" onclick="handleRegisterClick()" class="btn-pill-primary bg-indigo-600 mt-6 shadow-indigo-200">註冊並登入</button>
                </div>
            </div>
        </div>`;
}

function clearError() { document.getElementById('login-error').innerText = ""; }
function clearRegError() { document.getElementById('reg-error').innerText = ""; }

// --- Auth Logic ---
async function handleLoginClick() {
    const nick = document.getElementById('login-nick').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    if(!nick || !pass) return document.getElementById('login-error').innerText = "請輸入帳號和密碼";
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 登入中...';
    try { await loginUser(nick, pass, false); } catch(e) { btn.disabled = false; btn.innerHTML = '登入'; document.getElementById('login-error').innerText = e.message; }
}

async function handleRegisterClick() {
    const email = document.getElementById('reg-email').value.trim();
    const nick = document.getElementById('reg-nick').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    if(!email || !nick || !pass) return document.getElementById('reg-error').innerText = "所有欄位皆為必填";
    const btn = document.getElementById('btn-reg');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 建立中...';
    try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'register', nickname: nick, password: pass, email: email }) });
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        await loginUser(nick, pass, false, true); 
    } catch(e) { btn.disabled = false; btn.innerHTML = '註冊並登入'; document.getElementById('reg-error').innerText = e.message; }
}

async function loginUser(nick, pass, isAuto, isFirstTime = false) {
    try {
        if(!isAuto) setLoading(true, "正在登入雲端...");
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nickname: nick, password: pass }) });
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        state.user = {
            nickname: data.nickname, email: data.email, password: pass,
            totalLearned: parseInt(data.totalLearned)||0, streak: parseInt(data.streak)||1, points: parseInt(data.points)||0,
            currentBook: data.currentBook || null, customBooks: Array.isArray(data.customBooks) ? data.customBooks : [],
            settings: state.user?.settings || { notifications: false, notificationTime: "20:00", speechRate: 1.0 }
        };
        state.progress = data.progress || {};
        state.customBooks = state.user.customBooks;
        state.isLoggedIn = true;
        saveState();
        
        if(isAuto) { render(); setLoading(false); }
        else {
            setLoading(false);
            if(isFirstTime || !state.user.currentBook) renderInitialBookSelection(document.getElementById('app'));
            else { render(); checkAnnouncement(); }
        }
        return true;
    } catch(e) { setLoading(false); if(isAuto) renderLogin(); else throw e; }
}

// --- Book Selection ---
function renderInitialBookSelection(c) {
    c.innerHTML = `
        <div class="h-full bg-slate-50 flex flex-col p-6 animate-fade-in items-center justify-center">
            <div class="w-full max-w-md bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col h-[80vh]">
                <div class="text-center mb-6 mt-4">
                    <div class="w-20 h-20 bg-indigo-100 rounded-3xl flex items-center justify-center mx-auto mb-4 text-indigo-600 text-4xl animate-bounce"><i class="fas fa-book-open"></i></div>
                    <h1 class="text-2xl font-bold text-slate-800">選擇第一本教材</h1>
                    <p class="text-slate-400 text-sm mt-1 font-medium">這將會同步到您的雲端帳號</p>
                </div>
                <div class="flex-1 overflow-y-auto pb-4 px-1 space-y-3">
                    ${renderSelectableBook('GEPT_Elem', '全民英檢 初級', 'bg-green-500')}
                    ${renderSelectableBook('GEPT_Inter', '全民英檢 中級', 'bg-blue-500')}
                    ${renderSelectableBook('GEPT_High', '全民英檢 中高級', 'bg-purple-500')}
                    ${renderSelectableBook('Custom_World', '單字環遊世界 (全部)', 'bg-pink-500')}
                </div>
            </div>
        </div>`;
}
function renderSelectableBook(id, name, color) {
    return `<button onclick="handleFirstBookSelect('${id}')" class="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 flex items-center space-x-4 active:scale-95 transition-all text-left hover:border-indigo-500 hover:bg-white hover:shadow-md group"><div class="w-12 h-12 rounded-xl ${color} text-white flex items-center justify-center text-xl shadow-sm group-hover:scale-110 transition-transform"><i class="fas fa-book"></i></div><div><div class="font-bold text-slate-800 text-lg">${name}</div><div class="text-xs text-slate-400 font-bold">點擊開始學習</div></div></button>`;
}
function handleFirstBookSelect(id) { state.user.currentBook = id; saveState(); render(); checkAnnouncement(); }

// --- Main Layout ---
function render() {
    const app = document.getElementById('app');
    if (!state.isLoggedIn) return renderLogin();
    if (!state.user.currentBook) return renderInitialBookSelection(app);
    app.innerHTML = `
        <div class="flex flex-col h-full bg-slate-50 w-full">
            <div id="main-content" class="content-area relative w-full overflow-hidden"></div>
            <div class="absolute bottom-0 left-0 w-full h-[85px] bg-white border-t border-slate-200 flex justify-around items-center pb-safe z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.03)]">
                ${renderNavItem('learn', '背單字', 'fa-brain')}
                ${renderNavItem('books', '選擇教材', 'fa-book-open')}
                ${renderNavItem('profile', '個人檔案', 'fa-user-astronaut')}
            </div>
        </div>`;
    renderActiveTab();
}
function renderNavItem(id, l, i) {
    const act = state.activeTab === id;
    return `<button onclick="state.activeTab='${id}';render()" class="flex flex-col items-center justify-center w-full h-full space-y-1 group"><div class="px-5 py-1.5 rounded-full ${act?'bg-indigo-50 scale-110':'scale-100'} transition-all duration-300"><i class="fas ${i} text-xl ${act?'text-indigo-600':'text-slate-400'} transition-colors"></i></div><span class="text-[10px] font-bold ${act?'text-indigo-600':'text-slate-400'}">${l}</span></button>`;
}
function renderActiveTab() {
    const content = document.getElementById('main-content');
    if (state.activeTab === 'learn') renderLearnTab(content);
    else if (state.activeTab === 'books') renderMaterialsTab(content);
    else if (state.activeTab === 'profile') renderProfileTab(content);
}

// --- BOOK EDITOR ---
function openBookEditor(bookId) {
    if (bookId) {
        const book = state.customBooks.find(b => b.id === bookId);
        state.tempBook = { id: book.id, name: book.name, words: [...book.words] }; 
    } else {
        state.tempBook = { id: null, name: "", words: [] };
    }
    renderBookEditor();
}

function renderBookEditor() {
    const isNew = !state.tempBook.id;
    document.getElementById('main-content').innerHTML = `
        <div class="h-full bg-slate-50 flex flex-col z-50 absolute inset-0 animate-fade-in">
            <div class="bg-white p-4 flex items-center justify-between border-b border-slate-200 shadow-sm sticky top-0 z-10">
                <button onclick="renderMaterialsTab(document.getElementById('main-content'))" class="text-slate-500 font-bold text-sm"><i class="fas fa-times mr-1"></i> 取消</button>
                <h2 class="font-extrabold text-slate-800">${isNew ? '建立單字書' : '編輯單字書'}</h2>
                <button onclick="saveBook()" class="text-indigo-600 font-bold text-sm">儲存 <i class="fas fa-check"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-5 space-y-6">
                <div><label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">書名</label><div class="input-pill-container bg-white"><input type="text" id="book-name" value="${state.tempBook.name}" placeholder="例如：我的易錯單字" class="input-field-clean" oninput="state.tempBook.name=this.value"></div></div>
                <div><label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">加入單字</label><div class="input-pill-container bg-white mb-2"><i class="fas fa-search input-icon-left"></i><input type="text" id="word-search" placeholder="搜尋系統單字庫..." class="input-field-clean" oninput="handleSearch(this.value)"></div><div id="search-results" class="hidden bg-white rounded-2xl shadow-lg border border-slate-100 max-h-48 overflow-y-auto mb-4"></div></div>
                <div><div class="flex justify-between items-end mb-2 ml-1"><label class="text-xs font-bold text-slate-400 uppercase tracking-wider">已選單字 (${state.tempBook.words.length})</label>${state.tempBook.words.length>0?'<button onclick="clearAllWords()" class="text-xs text-red-400 font-bold">清空</button>':''}</div><div class="flex flex-wrap gap-2">${state.tempBook.words.length===0?'<div class="w-full text-center p-8 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 text-sm">還沒有加入任何單字</div>':state.tempBook.words.map(w=>`<span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-bold bg-indigo-50 text-indigo-600 border border-indigo-100">${w}<button onclick="removeWord('${w}')" class="ml-2 text-indigo-400 hover:text-red-500"><i class="fas fa-times"></i></button></span>`).join('')}</div></div>
            </div>
        </div>`;
}

function handleSearch(query) {
    const resultsDiv = document.getElementById('search-results');
    if (!query) { resultsDiv.classList.add('hidden'); return; }
    const q = query.toLowerCase();
    const matches = state.vocabulary.filter(v => (v.word.toLowerCase().includes(q) || v.definition_zh.includes(q)) && !state.tempBook.words.includes(v.word)).slice(0, 10);
    if (matches.length > 0) {
        resultsDiv.innerHTML = matches.map(m => `<button onclick="addWord('${m.word}')" class="w-full text-left px-4 py-3 border-b border-slate-50 hover:bg-slate-50 flex justify-between items-center"><div><div class="font-bold text-slate-700">${m.word}</div><div class="text-xs text-slate-400">${m.definition_zh}</div></div><i class="fas fa-plus text-indigo-500 bg-indigo-50 rounded-full w-6 h-6 flex items-center justify-center text-xs"></i></button>`).join('');
        resultsDiv.classList.remove('hidden');

// --- FULL COURSE LOGIC (Core Feature) ---

function startLesson(idx) {
    let words = [];
    const bookId = state.user.currentBook;
    if (bookId.includes('GEPT')) words = getBookWords(bookId);
    else if (bookId === 'Custom_World') words = [...state.vocabulary];
    else { const cb = state.customBooks.find(b => b.id === bookId); words = state.vocabulary.filter(w => cb.words.includes(w.word)); }
    const lessons = []; for(let i=0; i<words.length; i+=7) lessons.push(words.slice(i, i+7));

    state.session.originalQueue = [...lessons[idx]];
    state.session.failedQueue = [];
    
    // SRS Check: Before lesson, insert words due for review
    const now = Date.now();
    state.session.reviewQueue = Object.keys(state.progress).filter(w => {
        const p = state.progress[w]; return p.status==='learned' && p.nextReview <= now;
    }).map(w => state.vocabulary.find(v=>v.word===w)).filter(Boolean).slice(0, 5); // Limit 5

    // Start Flow
    if (state.session.reviewQueue.length > 0) {
        alert(`複習時間！有 ${state.session.reviewQueue.length} 個舊單字需要複習`);
        state.session.currentModeQueue = [...state.session.reviewQueue];
        state.session.currentPhase = 'srs_check'; // Goes to card -> rating -> back to lesson
    } else {
        state.session.currentModeQueue = [...state.session.originalQueue];
        state.session.currentPhase = 'flashcard';
    }
    
    state.session.currentIndex = 0;
    renderStudyScreen();
}

function renderStudyScreen() {
    const queue = state.session.currentModeQueue;
    const w = queue[state.session.currentIndex];
    const content = document.getElementById('main-content');

    // Phase Transitions
    if (!w) {
        const phase = state.session.currentPhase;
        if (phase === 'srs_check') {
            // SRS done, start lesson
            state.session.currentModeQueue = [...state.session.originalQueue];
            state.session.currentPhase = 'flashcard';
        } else if (phase === 'flashcard') {
            state.session.currentPhase = 'sentence';
        } else if (phase === 'sentence') {
            state.session.currentPhase = 'match';
        } else if (phase === 'match') {
            state.session.currentPhase = 'spell';
        } else if (phase === 'spell') {
            state.session.currentPhase = 'rating';
        } else if (phase === 'rating') {
            // Check for failures (Red Loop)
            if (state.session.failedQueue.length > 0) {
                alert(`有 ${state.session.failedQueue.length} 個單字需要加強！`);
                state.session.currentModeQueue = [...state.session.failedQueue];
                state.session.failedQueue = []; // Reset for next loop
                state.session.currentPhase = 'flashcard'; // Restart loop
            } else {
                renderLessonComplete(content);
                return;
            }
        }
        state.session.currentIndex = 0;
        state.session.currentSentenceMistakes = 0;
        renderStudyScreen();
        return;
    }

    // Render Logic
    let html = '';
    const progress = `${state.session.currentIndex + 1} / ${queue.length}`;
    const modeName = {
        'srs_check': '複習', 'flashcard': '單字卡', 'sentence': '例句重組', 'match': '配對', 'spell': '聽寫', 'rating': '總複習'
    }[state.session.currentPhase];

    // 1. Flashcard (Front/Back)
    if (state.session.currentPhase === 'flashcard' || state.session.currentPhase === 'srs_check') {
        html = `
            <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto">
                <div class="w-full aspect-[3/4] bg-white rounded-3xl shadow-xl border border-slate-100 flex flex-col items-center justify-center text-center p-8 relative overflow-hidden group">
                    <!-- Front -->
                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 opacity-100 transition-opacity duration-500 group-[.flipped]:opacity-0 flex flex-col items-center justify-center p-4 pointer-events-none">
                        <h2 class="text-4xl font-bold text-white break-all drop-shadow-md">${w.word}</h2>
                        <p class="text-white/60 mt-8 text-sm font-bold tracking-widest animate-pulse">點擊翻面</p>
                    </div>
                    <!-- Back -->
                    <div class="absolute inset-0 bg-white opacity-0 transition-opacity duration-500 group-[.flipped]:opacity-100 flex flex-col items-center justify-center p-6">
                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold mb-6">${w.part_of_speech || 'Word'}</span>
                        <h3 class="text-3xl font-bold text-slate-800 mb-6 leading-tight">${w.definition_zh}</h3>
                        <button onclick="event.stopPropagation(); speak('${w.word}')" class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 text-2xl shadow-sm mb-6 active:scale-95 transition-transform"><i class="fas fa-volume-up"></i></button>
                        ${w.example_en ? `<p class="text-sm text-slate-500 italic border-t border-slate-100 pt-4 w-full">"${w.example_en}"</p>` : ''}
                    </div>
                </div>
                <button onclick="document.querySelector('.group').classList.toggle('flipped')" class="btn-pill-secondary mt-8 w-full max-w-xs">翻面 / Flip</button>
                <button onclick="nextStep()" class="btn-pill-primary mt-4 w-full max-w-xs">下一個</button>
            </div>`;
    }
    // 2. Sentence
    else if (state.session.currentPhase === 'sentence') {
        html = renderSentenceBuilder(w);
        setTimeout(initDragDrop, 100);
    }
    // 3. Match
    else if (state.session.currentPhase === 'match') {
        const others = state.vocabulary.filter(x => x.word !== w.word).sort(() => 0.5 - Math.random()).slice(0, 3);
        const opts = [w, ...others].sort(() => 0.5 - Math.random());
        html = `
            <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto">
                <h2 class="text-4xl font-bold text-slate-800 mb-10 text-center">${w.word}</h2>
                <div class="space-y-3 w-full">
                    ${opts.map(o => `<button onclick="checkMatch('${o.word}','${w.word}',this)" class="w-full bg-white p-5 rounded-2xl border-2 border-slate-100 text-slate-600 font-bold text-lg shadow-sm hover:border-indigo-200 transition-all text-left">${o.definition_zh}</button>`).join('')}
                </div>
            </div>`;
    }
    // 4. Spell
    else if (state.session.currentPhase === 'spell') {
        html = `
            <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto text-center">
                <button onclick="speak('${w.word}')" class="w-24 h-24 bg-indigo-600 rounded-full text-white text-3xl mb-8 shadow-xl shadow-indigo-300 animate-pulse active:scale-95 transition-transform"><i class="fas fa-volume-up"></i></button>
                <p class="text-slate-400 mb-4 font-bold">輸入聽到的單字 (無提示)</p>
                <input type="text" id="spell-inp" class="input-modern mb-8 text-3xl tracking-widest lowercase text-center" autocomplete="off">
                <div class="flex gap-4 w-full">
                    <button onclick="nextStep()" class="btn-pill-secondary flex-1">跳過</button>
                    <button onclick="checkSpell('${w.word}')" class="btn-pill-primary flex-1">檢查</button>
                </div>
            </div>`;
        setTimeout(() => document.getElementById('spell-inp')?.focus(), 300);
    }
    // 5. Rating (SRS)
    else if (state.session.currentPhase === 'rating') {
        html = `
            <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto text-center">
                <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 w-full mb-8">
                    <h2 class="text-3xl font-bold text-slate-800 mb-2">${w.word}</h2>
                    <p class="text-slate-500 text-lg">${w.definition_zh}</p>
                </div>
                <p class="text-slate-400 text-sm font-bold mb-4 uppercase tracking-widest">學習狀況回報</p>
                <div class="space-y-3 w-full">
                    <button onclick="rate('green')" class="w-full bg-green-50 text-green-600 p-4 rounded-2xl font-bold border-2 border-green-100 active:scale-95 transition-transform">我很熟 (Pass)</button>
                    <button onclick="rate('yellow')" class="w-full bg-amber-50 text-amber-600 p-4 rounded-2xl font-bold border-2 border-amber-100 active:scale-95 transition-transform">有點問題 (Review)</button>
                    <button onclick="rate('red')" class="w-full bg-red-50 text-red-600 p-4 rounded-2xl font-bold border-2 border-red-100 active:scale-95 transition-transform">我還是不會 (Retry)</button>
                </div>
            </div>`;
    }

    content.innerHTML = `
        <div class="h-full bg-slate-50 pt-16 pb-20 relative z-30">
            <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-40 bg-slate-50/80 backdrop-blur-sm">
                <button onclick="renderActiveTab()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-400 shadow-sm border border-slate-100"><i class="fas fa-times"></i></button>
                <span class="text-xs font-bold text-slate-400 bg-white px-3 py-1 rounded-full border border-slate-100">${modeName} ${progress}</span>
                <div class="w-10"></div>
            </div>
            ${html}
        </div>`;
}

function nextStep() {
    state.session.currentIndex++;
    renderStudyScreen();
}

function rate(rating) {
    const w = state.session.currentModeQueue[state.session.currentIndex];
    updateWordProgress(w.word, rating);
    if (rating === 'red') {
        if (!state.session.failedQueue.find(fv => fv.word === w.word)) {
            state.session.failedQueue.push(w); // Add to Red Loop
        }
    }
    nextStep();
}

function checkMatch(selected, correct, btn) {
    if (selected === correct) {
        sounds.correct.play();
        btn.classList.add('bg-green-50', 'border-green-500', 'text-green-600');
        setTimeout(nextStep, 500);
    } else {
        sounds.wrong.play();
        btn.classList.add('bg-red-50', 'border-red-500', 'text-red-600');
    }
}

function checkSpell(correct) {
    const val = document.getElementById('spell-inp').value.trim().toLowerCase();
    if (val === correct.toLowerCase()) {
        sounds.correct.play();
        nextStep();
    } else {
        sounds.wrong.play();
        document.getElementById('spell-inp').classList.add('border-red-500', 'text-red-500');
    }
}

// --- Sentence Builder ---
function renderSentenceBuilder(w) {
    if(!w.example_en) return `<div class="h-full flex flex-col justify-center items-center text-slate-400">無例句<button onclick="nextStep()" class="btn-pill-primary mt-4">跳過</button></div>`;
    window.targetS = w.example_en.replace(/[.,!?;:]/g, '').split(' ');
    return `
    <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto">
        <h2 class="text-xl font-bold text-slate-700 mb-6 text-center leading-relaxed">${w.example_zh}</h2>
        <div id="drop" class="min-h-[120px] w-full bg-white border-2 border-dashed border-indigo-200 rounded-2xl mb-6 p-4 flex flex-wrap gap-2 justify-center content-start transition-colors"></div>
        <div id="source" class="flex flex-wrap gap-2 justify-center mb-8">
            ${window.targetS.slice().sort(() => 0.5 - Math.random()).map(x => `<div class="draggable-word bg-white border-b-4 border-indigo-100 px-4 py-2 rounded-xl font-bold text-indigo-600 cursor-pointer shadow-sm active:scale-95 active:bg-indigo-50 select-none" draggable="true" data-word="${x}">${x}</div>`).join('')}
        </div>
        <button onclick="checkSentence()" class="btn-pill-primary">檢查排列</button>
        <p class="text-xs text-slate-400 mt-4">點擊單字可移動</p>
    </div>`;
}
function initDragDrop() {
    document.querySelectorAll('.draggable-word').forEach(e => {
        e.addEventListener('click', function() {
            const target = this.parentElement.id === 'source' ? document.getElementById('drop') : document.getElementById('source');
            target.appendChild(this);
        });
    });
}
function checkSentence() {
    const cur = Array.from(document.getElementById('drop').children).map(x => x.dataset.word.toLowerCase());
    if (JSON.stringify(cur) === JSON.stringify(window.targetS.map(x => x.toLowerCase()))) {
        sounds.correct.play();
        document.getElementById('drop').classList.add('border-green-500', 'bg-green-50');
        setTimeout(nextStep, 800);
    } else {
        sounds.wrong.play();
        document.getElementById('drop').classList.add('border-red-500');
        setTimeout(() => document.getElementById('drop').classList.remove('border-red-500'), 500);
    }
}

// ... (Helpers: saveState, logout, etc.) ...
function saveState() {
    if(!state.user) return;
    localStorage.setItem('wv_user_v11', JSON.stringify(state.user));
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'sync', nickname: state.user.nickname, customBooks: state.user.customBooks || [], currentBook: state.user.currentBook || '', totalLearned: Object.keys(state.progress).length, streak: state.user.streak, points: state.user.points, progress: state.progress }) }).catch(e=>{});
}
function logout() { localStorage.removeItem('wv_user_v11'); state.user=null; state.isLoggedIn=false; renderLogin(); }
function updateWordProgress(w, r) { if(!state.progress[w]) state.progress[w]={status:'learned',level:0,nextReview:0}; const p=state.progress[w]; if(r==='red'){p.level=0;p.nextReview=Date.now()+86400000;}else if(r==='yellow'){p.level=Math.max(1,p.level);p.nextReview=Date.now()+172800000;}else{p.level++;p.nextReview=Date.now()+(Math.pow(2,p.level)*86400000);} saveState(); }
function speak(t) { new Audio(`./audio/${t}.mp3`).play().catch(()=>{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=state.user.settings.speechRate||1.0; speechSynthesis.speak(u); }); }
function getBookWords(id) {
    if(id==='GEPT_Elem') return state.vocabulary.filter(w=>w.category&&w.category.includes('初級'));
    if(id==='GEPT_Inter') return state.vocabulary.filter(w=>w.category&&w.category.includes('中級')&&!w.category.includes('高級'));
    if(id==='GEPT_High') return state.vocabulary.filter(w=>w.category&&w.category.includes('中高級'));
    return [];
}
function getBookName(id) { if(id==='GEPT_Elem')return '全民英檢初級'; if(id==='GEPT_Inter')return '全民英檢中級'; if(id==='GEPT_High')return '全民英檢中高級'; if(id==='Custom_World')return '單字環遊世界'; const c=state.customBooks.find(b=>b.id===id); return c?c.name:'Unknown'; }
function checkAnnouncement() { if(state.remoteSettings.announcement !== "0") { document.getElementById('announcement-text').innerText = state.remoteSettings.announcement; document.getElementById('announcement-modal').classList.remove('hidden'); } }
function closeAnnouncement() { document.getElementById('announcement-modal').classList.add('hidden'); }
function renderLessonComplete(c) { sounds.complete.play(); c.innerHTML=`<div class="h-full flex flex-col items-center justify-center p-8 text-center animate-fade-in"><h1 class="text-3xl font-bold text-slate-800 mb-2">完成！</h1><div id="lottery-box" class="w-48 h-48 bg-white rounded-3xl shadow-lg border-4 border-indigo-50 flex items-center justify-center mb-8 text-6xl text-indigo-300"><i class="fas fa-gift"></i></div><button id="btn-lottery" onclick="playLottery()" class="btn-pill-primary bg-gradient-to-r from-pink-500 to-indigo-500 border-0">抽獎</button><button onclick="renderActiveTab()" class="mt-4 text-slate-400 font-bold">跳過</button></div>`; }
function playLottery() { const btn=document.getElementById('btn-lottery'); const box=document.getElementById('lottery-box'); btn.disabled=true; let i=0; const pts=state.remoteSettings.lotteryPoints; const interval=setInterval(()=>{box.innerHTML=`<span class="text-indigo-500 font-bold">${pts[i%pts.length]}</span>`;i++;sounds.spin.play();},80); setTimeout(()=>{clearInterval(interval);const win=pts[Math.floor(Math.random()*pts.length)];box.innerHTML=`<div class="animate-float"><span class="text-5xl font-extrabold text-amber-500">+${win}</span><div class="text-xs text-slate-400 mt-2 font-bold">POINTS</div></div>`;state.user.points+=win;saveState();confetti({particleCount:150,spread:70,origin:{y:0.6}});sounds.complete.play();btn.innerHTML="領取";btn.onclick=()=>renderActiveTab();btn.disabled=false;},2000); }

window.onload = initApp;
</script>
</body>
