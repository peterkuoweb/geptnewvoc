        <button onclick="closeAnnouncement()" class="btn-modern-primary">收到！</button>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbyR_aKVkSoHuBnpBj_7EPQzB1HGbvQyH7yIsFTYnCIfniVWwYA0RC3d-8RgZvQd5M4aJg/exec";
const DB_URL = './allvoc.json';

const state = {
    user: null, // { nickname, password, totalLearned, streak, points, customBooks, currentBook }
    isLoggedIn: false,
    activeTab: 'learn',
    vocabulary: [],
    progress: {}, 
    session: { queue: [], currentIndex: 0, mode: 'card', reviewQueue: [], currentSentenceMistakes: 0 },
    remoteSettings: { announcement: "0", lotteryPoints: [10, 20, 50, 100] }
};

const sounds = {
    correct: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3'),
    wrong: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'),
    complete: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'),
    spin: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-game-level-music-689.mp3') 
};

// --- Core Functions ---

async function initApp() {
    const savedUser = localStorage.getItem('wv_user_v4');
    
    // 1. Fetch Vocabulary
    try {
        const response = await fetch(DB_URL);
        state.vocabulary = await response.json();
    } catch (e) {
        state.vocabulary = [];
        console.warn("JSON load failed, waiting for upload");
    }

    // 2. Viewport Fix
    const setAppHeight = () => document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    window.addEventListener('resize', setAppHeight);
    setAppHeight();

    // 3. Check Login
    if (savedUser) {
        const localUser = JSON.parse(savedUser);
        loginUser(localUser.nickname, localUser.password, true);
    } else {
        renderLogin();
    }
    
    // 4. Fetch Settings background
    fetch(`${API_URL}?action=getSettings`).then(r=>r.json()).then(d=>{
        if(d.Announcement) state.remoteSettings.announcement = String(d.Announcement);
        if(d.LotteryPoints) state.remoteSettings.lotteryPoints = String(d.LotteryPoints).split(',').map(Number);
    }).catch(e=>{});
}

// --- UI RENDERERS: AUTH ---

function renderLogin() {
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="h-full w-full bg-animated flex items-center justify-center p-6 relative overflow-hidden">
            <!-- Decorative Elements -->
            <div class="absolute top-10 left-10 w-32 h-32 bg-white/10 rounded-full blur-2xl animate-float"></div>
            <div class="absolute bottom-10 right-10 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl animate-float" style="animation-delay: 2s"></div>

            <div class="glass-panel w-full max-w-sm p-8 rounded-3xl relative z-10 animate-fade-in shadow-2xl">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg transform rotate-6">
                        <i class="fas fa-rocket text-3xl text-white"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Word Voyager</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">開啟你的英語冒險之旅</p>
                </div>
                
                <div class="space-y-4">
                    <div class="relative group">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
                        <input type="text" id="login-nick" placeholder="帳號 / 英文暱稱" class="input-modern pl-12" oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '')">
                    </div>
                    <div class="relative group">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
                        <input type="password" id="login-pass" placeholder="密碼" class="input-modern pl-12">
                    </div>
                    
                    <button onclick="handleLoginClick()" class="btn-modern-primary mt-6">
                        登入冒險 <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                    
                    <div class="relative py-4">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                        <div class="relative flex justify-center text-sm"><span class="px-2 bg-white/80 text-slate-400">or</span></div>
                    </div>

                    <button onclick="renderRegister()" class="btn-modern-secondary text-indigo-600">
                        註冊新帳號
                    </button>
                </div>
            </div>
            
            <div class="absolute bottom-6 text-white/50 text-xs font-medium">v4.2 Cloud Sync</div>
        </div>
    `;
}

function renderRegister() {
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="h-full w-full bg-slate-50 flex items-center justify-center p-6 relative">
            <div class="glass-panel w-full max-w-sm p-8 rounded-3xl relative z-10 animate-fade-in shadow-xl border border-slate-100">
                <button onclick="renderLogin()" class="absolute top-6 left-6 text-slate-400 hover:text-indigo-600 transition"><i class="fas fa-arrow-left text-lg"></i></button>
                
                <div class="text-center mb-8 mt-4">
                    <h1 class="text-2xl font-bold text-slate-800">建立新帳號</h1>
                    <p class="text-slate-400 text-sm mt-1">只需幾秒鐘即可開始</p>
                </div>
                
                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1">帳號 (僅限英文數字)</label>
                        <input type="text" id="reg-nick" class="input-modern" placeholder="e.g. Peter" oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '')">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 ml-1">密碼</label>
                        <input type="password" id="reg-pass" class="input-modern" placeholder="••••••">
                    </div>
                    
                    <button onclick="handleRegisterClick()" class="btn-modern-primary mt-4 bg-gradient-to-r from-indigo-600 to-purple-600">
                        註冊並登入
                    </button>
                </div>
            </div>
        </div>
    `;
}

// --- AUTH LOGIC ---

async function handleLoginClick() {
    const nick = document.getElementById('login-nick').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    if(!nick || !pass) return alert("請輸入帳號和密碼");
    setLoading(true, "正在登入...");
    await loginUser(nick, pass, false);
}

async function handleRegisterClick() {
    const nick = document.getElementById('reg-nick').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    if(!nick || !pass) return alert("請輸入帳號和密碼");
    
    setLoading(true, "建立帳號中...");
    
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'register', nickname: nick, password: pass })
        });
        const data = await res.json();
        
        if(data.error) throw new Error(data.error);
        
        // 註冊成功 -> 自動登入 -> 導向選書
        await loginUser(nick, pass, false, true); 
        
    } catch(e) {
        alert("註冊失敗: " + e.message);
        setLoading(false);
    }
}

async function loginUser(nick, pass, isAuto, isFirstTime = false) {
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'login', nickname: nick, password: pass })
        });
        const data = await res.json();
        
        if(data.error) throw new Error(data.error);
        
        // Merge Cloud Data
        state.user = {
            nickname: data.nickname,
            password: pass,
            totalLearned: parseInt(data.totalLearned) || 0,
            streak: parseInt(data.streak) || 1,
            points: parseInt(data.points) || 0,
            currentBook: data.currentBook || null, // Load from cloud
            customBooks: Array.isArray(data.customBooks) ? data.customBooks : [], // Load from cloud
            settings: { notifications: false, sound: true, speechRate: 1.0 }
        };
        state.progress = data.progress || {};
        state.customBooks = state.user.customBooks; // Sync state
        state.isLoggedIn = true;
        
        saveState();
        
        if(isAuto) {
            render(); 
        } else {
            setLoading(false);
            if(isFirstTime || !state.user.currentBook) {
                renderInitialBookSelection(document.getElementById('app')); // Force selection
            } else {
                render();
                checkAnnouncement();
            }
        }
        
    } catch(e) {
        if(!isAuto) {
            alert("錯誤: " + e.message);
            setLoading(false);
        }
    }
}

// --- Initial Book Selection (For First Time / No Book) ---
function renderInitialBookSelection(container) {
    container.innerHTML = `
        <div class="h-full bg-slate-50 flex flex-col p-6 animate-fade-in">
            <div class="mt-8 mb-6 text-center">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600 text-2xl animate-bounce">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">選擇你的第一本教材</h1>
                <p class="text-slate-500 text-sm mt-2">這將會儲存在你的學習檔案中</p>
            </div>
            
            <div class="flex-1 overflow-y-auto pb-safe space-y-3">
                ${renderSelectableBook('GEPT_Elem', '全民英檢 初級', 'bg-green-500')}
                ${renderSelectableBook('GEPT_Inter', '全民英檢 中級', 'bg-blue-500')}
                ${renderSelectableBook('GEPT_High', '全民英檢 中高級', 'bg-purple-500')}
                ${renderSelectableBook('Custom_World', '單字環遊世界 (全部)', 'bg-pink-500')}
            </div>
        </div>
    `;
}

function renderSelectableBook(id, name, color) {
    return `
        <button onclick="handleFirstBookSelect('${id}')" class="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4 active:scale-95 transition-transform text-left group hover:border-indigo-300">
            <div class="w-12 h-12 rounded-xl ${color} text-white flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition-transform">
                <i class="fas fa-book"></i>
            </div>
            <div>
                <div class="font-bold text-slate-800 text-lg">${name}</div>
                <div class="text-xs text-slate-400">點擊開始學習</div>
            </div>
        </button>
    `;
}

function handleFirstBookSelect(id) {
    state.user.currentBook = id;
    saveState(); // Will sync to cloud immediately
    render();
    checkAnnouncement();
}

// --- Main App Logic ---

function render() {
    const app = document.getElementById('app');
    if (!state.isLoggedIn) return renderLogin();
    
    // Safety check: if logged in but no book selected (rare edge case), force select
    if (!state.user.currentBook) {
        return renderInitialBookSelection(app);
    }
    
    renderMainLayout(app);
}

function renderMainLayout(container) {
    container.innerHTML = `
        <div class="flex flex-col h-full bg-slate-50 w-full">
            <div id="main-content" class="content-area relative w-full overflow-hidden"></div>
            <div class="absolute bottom-0 left-0 w-full h-[85px] bg-white border-t border-slate-200 flex justify-around items-center pb-safe z-40 shadow-[0_-5px_10px_rgba(0,0,0,0.02)]">
                ${renderNavItem('learn', '背單字', 'fa-brain')}
                ${renderNavItem('books', '選擇教材', 'fa-book-open')}
                ${renderNavItem('profile', '個人檔案', 'fa-user-astronaut')}
            </div>
        </div>`;
    renderActiveTab();
}

function renderNavItem(id, l, i) {
    const isActive = state.activeTab === id;
    const color = isActive ? 'text-indigo-600' : 'text-slate-400';
    const bg = isActive ? 'bg-indigo-50' : '';
    return `
        <button onclick="state.activeTab='${id}';renderMainLayout(document.getElementById('app'))" class="flex flex-col items-center justify-center w-full h-full space-y-1 transition-all group">
            <div class="px-5 py-1.5 rounded-full ${bg} transition-all group-active:scale-90">
                <i class="fas ${i} text-xl ${color} transition-colors"></i>
            </div>
            <span class="text-[10px] font-bold ${color}">${l}</span>
        </button>
    `;
}

function renderActiveTab() {
    const content = document.getElementById('main-content');
    if (state.activeTab === 'learn') renderLearnTab(content);
    else if (state.activeTab === 'books') renderMaterialsTab(content);
    else if (state.activeTab === 'profile') renderProfileTab(content);
}

// --- Tab: Learn (Simplified for brevity, logic remains from V3) ---
function renderLearnTab(c) {
    const lessons = getLessons(state.user.currentBook);
    // ... Copy render logic ...
    // Note: Using state.user.currentBook now
    let html = `
        <div class="p-5 pt-10 pb-28 space-y-5 animate-fade-in h-full overflow-y-auto">
            <div class="flex justify-between items-end">
                <h1 class="text-3xl font-extrabold text-slate-800">今天學點什麼？</h1>
            </div>
            
            <div class="bg-indigo-600 rounded-2xl p-5 text-white shadow-lg shadow-indigo-200 flex justify-between items-center relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-indigo-200 text-xs font-bold uppercase tracking-wider mb-1">CURRENT BOOK</p>
                    <h2 class="font-bold text-xl">${getBookName(state.user.currentBook)}</h2>
                </div>
                <i class="fas fa-book-reader text-6xl text-white/10 absolute right-[-10px] bottom-[-10px]"></i>
            </div>
    `;
    
    // Check SRS
    const now = Date.now();
    const reviewList = Object.keys(state.progress).filter(w => {
        const p = state.progress[w];
        return p.status === 'learned' && p.nextReview && p.nextReview <= now;
    });

    if(reviewList.length > 0) {
        html += `<div onclick="startReview()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-4 rounded-xl shadow-lg cursor-pointer flex items-center justify-between"><div class="font-bold"><i class="fas fa-fire mr-2"></i> ${reviewList.length} 個單字待複習</div><i class="fas fa-chevron-right opacity-75"></i></div>`;
    }

    if(lessons.length === 0) html += `<div class="text-center text-slate-400 mt-10">本教材無內容或讀取中...</div>`;

    html += `<div class="space-y-3">`;
    html += lessons.map((l, i) => {
        const learned = l.filter(w => state.progress[w.word]?.status === 'learned').length;
        const isDone = learned === l.length;
        return `
            <div onclick="startLesson(${i})" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                <div class="flex items-center space-x-4 overflow-hidden">
                    <div class="w-12 h-12 rounded-full ${isDone?'bg-green-100 text-green-600':'bg-slate-100 text-slate-500'} flex items-center justify-center font-bold text-lg shrink-0">
                        ${isDone ? '<i class="fas fa-check"></i>' : i+1}
                    </div>
                    <div class="min-w-0">
                        <h3 class="font-bold text-slate-700 truncate">Lesson ${i+1}</h3>
                        <p class="text-xs text-slate-400 truncate w-40">${l.map(w=>w.word).join(', ')}</p>
                    </div>
                </div>
                <div class="text-xs font-bold ${isDone?'text-green-500':'text-slate-300'}">${learned}/${l.length}</div>
            </div>
        `;
    }).join('');
    html += `</div></div>`;
    c.innerHTML = html;
}

// --- Tab: Materials ---
function renderMaterialsTab(c) {
    c.innerHTML = `
        <div class="p-5 pt-10 pb-28 h-full overflow-y-auto space-y-6">
            <h1 class="text-3xl font-extrabold text-slate-800">教材庫</h1>
            
            <div class="space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">官方教材</h3>
                ${renderBookItem('GEPT_Elem','全民英檢初級','bg-green-500')}
                ${renderBookItem('GEPT_Inter','全民英檢中級','bg-blue-500')}
                ${renderBookItem('GEPT_High','全民英檢中高級','bg-purple-500')}
                ${renderBookItem('Custom_World','單字環遊世界','bg-pink-500')}
            </div>

            <div class="space-y-3 pt-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">自編單字書</h3>
                    <button onclick="alert('請至開發者後台匯入')" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-bold"><i class="fas fa-plus mr-1"></i> 新增</button>
                </div>
                ${state.customBooks.length === 0 ? '<div class="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-sm">尚無自建單字書</div>' : ''}
                ${state.customBooks.map(b => renderBookItem(b.id, b.name, 'bg-teal-500', true)).join('')}
            </div>
        </div>
    `;
}

function renderBookItem(id, name, color, isCustom) {
    const isCurrent = state.user.currentBook === id;
    const activeClass = isCurrent ? 'ring-2 ring-indigo-500 bg-indigo-50' : 'bg-white';
    const sub = isCustom ? `${state.customBooks.find(b=>b.id===id).words.length} words` : 'Official';
    
    return `
        <button onclick="handleBookSwitch('${id}')" class="w-full ${activeClass} p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transition-all active:scale-95 text-left group">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl ${color} text-white flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition-transform">
                    <i class="fas ${isCustom?'fa-pen-fancy':'fa-book'}"></i>
                </div>
                <div>
                    <div class="font-bold text-slate-700">${name}</div>
                    <div class="text-xs text-slate-400">${sub}</div>
                </div>
            </div>
            ${isCurrent ? '<i class="fas fa-check-circle text-indigo-500 text-xl"></i>' : ''}
        </button>
    `;
}

function handleBookSwitch(id) {
    state.user.currentBook = id;
    saveState();
    renderMaterialsTab(document.getElementById('main-content')); // Re-render to show active state
    showToast("已切換教材");
}

// --- Data & Helpers ---

function saveState() {
    if(!state.user) return;
    localStorage.setItem('wv_user_v4', JSON.stringify(state.user));
    localStorage.setItem('wv_progress_v4', JSON.stringify(state.progress)); // Optional local backup
    
    // Sync to Cloud
    fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'sync',
            nickname: state.user.nickname,
            // Include extra fields
            customBooks: state.user.customBooks || [],
            currentBook: state.user.currentBook || '',
            totalLearned: Object.keys(state.progress).length,
            streak: state.user.streak,
            points: state.user.points,
            progress: state.progress
        })
    }).catch(e => console.log("Bg Sync Fail"));
}

function getBookName(id) {
    if(id==='GEPT_Elem') return '全民英檢初級';
    if(id==='GEPT_Inter') return '全民英檢中級';
    if(id==='GEPT_High') return '全民英檢中高級';
    if(id==='Custom_World') return '單字環遊世界';
    const c = state.customBooks.find(b=>b.id===id);
    return c ? c.name : 'Unknown';
}

function getLessons(bookId) {
    // Re-implemented data fetching
    let words = [];
    if (bookId === 'GEPT_Elem') words = state.vocabulary.filter(w => w.category && w.category.includes('初級'));
    else if (bookId === 'GEPT_Inter') words = state.vocabulary.filter(w => w.category && w.category.includes('中級') && !w.category.includes('高級'));
    else if (bookId === 'GEPT_High') words = state.vocabulary.filter(w => w.category && w.category.includes('中高級'));
    else if (bookId === 'Custom_World') words = [...state.vocabulary];
    else {
        const customBook = state.customBooks.find(b => b.id === bookId);
        if (customBook) words = state.vocabulary.filter(w => customBook.words.includes(w.word));
    }
    
    const lessons = [];
    for (let i = 0; i < words.length; i += 7) lessons.push(words.slice(i, i + 7));
    return lessons;
}

// ... (Other functions: startLesson, renderStudyScreen, nextStep, etc. - Keep from V3 but update state references) ...
// For brevity, assuming the Study Logic from V3 is pasted here.
// IMPORTANT: Ensure startLesson uses `state.user.currentBook`

function startLesson(idx) {
    state.session.queue = [...getLessons(state.user.currentBook)[idx]];
    state.session.currentIndex = 0;
    state.session.mode = 'card';
    state.session.reviewQueue = [];
    renderStudyScreen();
}

function renderStudyScreen() {
    // Copy Study Screen Logic from V3, just update container references if needed
    // Ensure `renderLessonComplete` calls `playLottery` which updates `state.user.points`
    const w = state.session.queue[state.session.currentIndex];
    const content = document.getElementById('main-content');
    if(!w) {
        // Mode switch...
        const modes = ['card', 'sentence', 'match', 'spell', 'review'];
        const next = modes[modes.indexOf(state.session.mode) + 1];
        if(next) {
             if (next === 'sentence' && !state.session.queue.some(word => word.example_en)) {
                 state.session.mode = 'match'; 
            } else {
                 state.session.mode = next;
            }
            state.session.currentIndex = 0;
            renderStudyScreen();
        } else if (state.session.reviewQueue.length>0) {
            state.session.queue = [...state.session.reviewQueue]; state.session.reviewQueue=[]; state.session.mode='card'; state.session.currentIndex=0;
            alert('加強練習！'); renderStudyScreen();
        } else {
            renderLessonComplete(content);
        }
        return;
    }
    
    // Simple render map for demo
    let html = '';
    const progress = `${state.session.currentIndex+1}/${state.session.queue.length}`;
    if(state.session.mode==='card') html = `<div class="h-full flex flex-col justify-center p-6"><div class="w-full aspect-[3/4] bg-white rounded-3xl shadow-xl border flex flex-col items-center justify-center text-center p-4"><h2 class="text-4xl font-bold mb-4">${w.word}</h2><p class="text-slate-400 mb-8 text-sm">點擊翻面</p><button onclick="state.session.mode='card_back';renderStudyScreen()" class="btn-modern-primary w-32">翻面</button></div></div>`;
    if(state.session.mode==='card_back') html = `<div class="h-full flex flex-col justify-center p-6"><div class="w-full aspect-[3/4] bg-white rounded-3xl shadow-xl border flex flex-col items-center justify-center text-center p-4"><h2 class="text-2xl font-bold mb-4 text-slate-700">${w.definition_zh}</h2><button onclick="speak('${w.word}')" class="w-16 h-16 bg-indigo-50 rounded-full mb-4 flex items-center justify-center text-indigo-500"><i class="fas fa-volume-up"></i></button><button onclick="nextStep()" class="btn-modern-primary w-full mt-auto">下一個</button></div></div>`;
    // ... Implement other modes similarly ...
    // Fallback for demo
    if(!html) html = `<div class="h-full flex flex-col items-center justify-center"><h2 class="text-2xl font-bold">${state.session.mode}</h2><p>${w.word}</p><button onclick="nextStep()" class="btn-modern-primary mt-4">Next</button></div>`;
    
    content.innerHTML = `<div class="h-full bg-slate-50 pt-16 pb-20 relative z-30">${html}<div class="absolute top-0 left-0 w-full p-4 flex justify-between"><button onclick="renderActiveTab()"><i class="fas fa-times"></i></button><span>${progress}</span></div></div>`;
}
function nextStep(){ state.session.currentIndex++; renderStudyScreen(); }
function speak(t) { new Audio(`./audio/${t}.mp3`).play().catch(() => { const u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=state.user.settings.speechRate; speechSynthesis.speak(u); }); }

function renderLessonComplete(c) {
    sounds.complete.play();
    c.innerHTML = `<div class="h-full flex flex-col items-center justify-center p-8 text-center animate-fade-in"><h1 class="text-3xl font-bold text-slate-800 mb-2">完成！</h1><div id="lottery-box" class="w-48 h-48 bg-white rounded-3xl shadow-lg border-4 border-indigo-100 flex items-center justify-center mb-8 text-6xl text-indigo-300"><i class="fas fa-gift"></i></div><button id="btn-lottery" onclick="playLottery()" class="btn-modern-primary bg-gradient-to-r from-pink-500 to-indigo-500">抽獎</button><button onclick="renderActiveTab()" class="mt-4 text-slate-400">跳過</button></div>`;
}

function playLottery() {
    const btn = document.getElementById('btn-lottery');
    const box = document.getElementById('lottery-box');
    btn.disabled = true;
    let i = 0;
    const pts = state.remoteSettings.lotteryPoints;
    const interval = setInterval(() => {
        box.innerHTML = `<span class="text-indigo-500 font-bold">${pts[i%pts.length]}</span>`;
        i++;
        sounds.spin.play();
    }, 80);
    setTimeout(() => {
        clearInterval(interval);
        const win = pts[Math.floor(Math.random()*pts.length)];
        box.innerHTML = `<div class="animate-float"><span class="text-5xl font-extrabold text-amber-500">+${win}</span><div class="text-xs text-slate-400">POINTS</div></div>`;
        state.user.points += win;
        saveState();
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        sounds.complete.play();
        btn.innerHTML = "領取";
        btn.onclick = () => renderActiveTab();
        btn.disabled = false;
    }, 2000);
}

function renderProfileTab(c) {
    c.innerHTML = `
        <div class="p-6 pt-10 pb-28 h-full overflow-y-auto">
            <div class="flex items-center space-x-4 mb-8">
                <div class="w-20 h-20 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-full text-white flex items-center justify-center text-3xl font-bold shadow-xl border-4 border-white">
                    ${state.user.nickname[0].toUpperCase()}
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">${state.user.nickname}</h2>
                    <div class="text-amber-500 font-bold text-sm"><i class="fas fa-coins mr-1"></i> ${state.user.points}</div>
                </div>
            </div>
            <button onclick="logout()" class="w-full bg-white p-4 rounded-xl text-red-500 font-bold border border-red-100 shadow-sm mb-8">登出</button>
            <div class="text-center text-xs text-slate-300">V4.2</div>
        </div>
    `;
}

function logout() {
    localStorage.removeItem('wv_user_v4');
    state.user = null;
    state.isLoggedIn = false;
    renderLogin();
}

function setLoading(isLoading, text) {
    const d = document.getElementById('loading');
    if(isLoading) {
        d.classList.remove('hidden');
        d.querySelector('p').innerText = text;
    } else {
        d.classList.add('hidden');
    }
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = "fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-2 rounded-full shadow-xl text-sm z-50 animate-fade-in";
    t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2500);
}

function checkAnnouncement() {
    if(state.remoteSettings.announcement !== "0") {
        document.getElementById('announcement-text').innerText = state.remoteSettings.announcement;
        document.getElementById('announcement-modal').classList.remove('hidden');
    }
}
function closeAnnouncement() { document.getElementById('announcement-modal').classList.add('hidden'); }

window.onload = initApp;
