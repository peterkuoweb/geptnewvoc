<html lang="zh-TW">
<head>

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700&800&display=swap');
        :root { --app-height: 100dvh; }
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            height: var(--app-height);
            width: 100vw;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1);
        }

        /* --- 關鍵 UI 修正區 --- */

        /* 1. 輸入框容器：強制水平排列 (Flex-Row)，膠囊狀 (Rounded-Full) */
        .input-pill-container {
            display: flex;
            flex-direction: row; /* 確保左右排列 */
            align-items: center;
            width: 100%;
            background-color: #f8fafc; /* Slate-50 */
            border: 2px solid #e2e8f0; /* Slate-200 */
            border-radius: 9999px; /* Rounded Full */
            padding: 0.75rem 1.25rem; /* Padding */
            transition: all 0.2s;
        }
        .input-pill-container:focus-within {
            border-color: #6366f1; /* Indigo-500 */
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* 2. 圖標：固定寬度，靠左 */
        .input-icon-left {
            font-size: 1.25rem;
            color: #94a3b8; /* Slate-400 */
            margin-right: 0.75rem;
            min-width: 24px;
            text-align: center;
        }
        .input-pill-container:focus-within .input-icon-left {
            color: #6366f1;
        }

        /* 3. 輸入欄位本身：去掉所有邊框，填滿剩餘空間 */
        .input-field-clean {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-weight: 600;
            color: #334155;
            font-size: 1rem;
            width: 100%; /* Fix for flex child */
        }
        .input-field-clean::placeholder {
            color: #cbd5e1;
            font-weight: 500;
        }

        /* 4. 按鈕：置中、膠囊狀、明顯陰影 */
        .btn-pill-primary {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            font-weight: 800;
            padding: 1rem;
            border-radius: 9999px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-pill-primary:active {
            transform: scale(0.97);
            box-shadow: 0 5px 10px -5px rgba(79, 70, 229, 0.3);
        }
        .btn-pill-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-pill-secondary {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            color: #64748b;
            font-weight: 700;
            padding: 1rem;
            border-radius: 9999px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        .btn-pill-secondary:active {
            background-color: #f1f5f9;
            transform: scale(0.97);
        }

        /* Background Animation */
        .bg-animated {
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Other Utilities */
        #loading-overlay { z-index: 9999; }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .draggable-word.dragging { opacity: 0.5; transform: scale(0.95); }
    </style>

<body>

<!-- Loading Overlay -->
<div id="loading-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="relative mb-6">
        <div class="w-20 h-20 border-4 border-slate-100 border-t-indigo-500 rounded-full animate-spin"></div>
        <i class="fas fa-sailboat absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-indigo-500 text-2xl"></i>
    </div>
    <p id="loading-text" class="text-slate-500 font-bold text-sm tracking-widest animate-pulse">啟航中...</p>
</div>

<!-- Announcement Modal -->
<div id="announcement-modal" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-6">
    <div class="glass-panel rounded-3xl shadow-2xl max-w-sm w-full p-6 animate-fade-in relative overflow-hidden bg-white">
        <div class="text-center mb-6 mt-2">
            <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-500 text-3xl rotate-6">
                <i class="fas fa-bullhorn"></i>
            </div>
            <h3 class="text-xl font-extrabold text-slate-800">航海公告</h3>
        </div>
        <div id="announcement-text" class="text-slate-600 mb-8 text-center leading-relaxed whitespace-pre-wrap font-medium"></div>
        <button onclick="closeAnnouncement()" class="btn-pill-primary">收到！</button>
    </div>
</div>

<!-- Main App Container -->
<div id="app" class="h-full w-full"></div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const API_URL = "https://script.google.com/macros/s/AKfycbyR_aKVkSoHuBnpBj_7EPQzB1HGbvQyH7yIsFTYnCIfniVWwYA0RC3d-8RgZvQd5M4aJg/exec";
const DB_URL = './allvoc.json';

const state = {
    user: null, 
    isLoggedIn: false,
    activeTab: 'learn',
    vocabulary: [],
    progress: {}, 
    session: { queue: [], currentIndex: 0, mode: 'card', reviewQueue: [], currentSentenceMistakes: 0 },
    remoteSettings: { announcement: "0", lotteryPoints: [10, 20, 50, 100] }
};

const sounds = {
    correct: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3'),
    wrong: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3'),
    complete: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3'),
    spin: new Audio('https://assets.mixkit.co/sfx/preview/mixkit-game-level-music-689.mp3') 
};

// --- Core Functions ---

async function initApp() {
    const savedUser = localStorage.getItem('wv_user_v9'); // Version bump for email schema
    
    try {
        const response = await fetch(DB_URL);
        state.vocabulary = await response.json();
    } catch (e) {
        state.vocabulary = [];
    }

    const setAppHeight = () => document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    window.addEventListener('resize', setAppHeight);
    setAppHeight();

    fetch(`${API_URL}?action=getSettings`).then(r=>r.json()).then(d=>{
        if(d.Announcement) state.remoteSettings.announcement = String(d.Announcement);
        if(d.LotteryPoints) state.remoteSettings.lotteryPoints = String(d.LotteryPoints).split(',').map(Number);
    }).catch(e=>{});

    if (savedUser) {
        try {
            const localUser = JSON.parse(savedUser);
            if(!localUser.settings) localUser.settings = { notifications: false, notificationTime: "20:00", speechRate: 1.0 };
            // Pass true for auto-login
            await loginUser(localUser.nickname, localUser.password, true);
        } catch(e) {
            setLoading(false);
            renderLogin();
        }
    } else {
        setLoading(false);
        renderLogin();
    }
}

function setLoading(isLoading, text = "載入中...") {
    const el = document.getElementById('loading-overlay');
    const txt = document.getElementById('loading-text');
    if (isLoading) {
        if (el) {
            el.classList.remove('hidden');
            el.classList.remove('opacity-0');
            el.classList.remove('pointer-events-none');
        }
        if (txt) txt.innerText = text;
    } else {
        if (el) {
            el.classList.add('opacity-0');
            el.classList.add('pointer-events-none');
            setTimeout(() => { el.classList.add('hidden'); }, 300);
        }
    }
}

// --- UI RENDERERS: AUTH (Completely Redesigned) ---

function renderLogin() {
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="h-full w-full bg-animated flex flex-col items-center justify-center p-6">
            <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] animate-fade-in shadow-xl flex flex-col items-center relative overflow-hidden">
                
                <!-- Logo -->
                <div class="mb-8 flex flex-col items-center">
                    <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 text-indigo-500 text-4xl border-4 border-indigo-50">
                        <i class="fas fa-sailboat"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">單字帆船</h1>
                    <p class="text-slate-400 font-bold text-xs tracking-[0.2em] mt-1">WORD SAIL</p>
                </div>
                
                <!-- Error Message -->
                <p id="login-error" class="text-red-500 text-sm font-bold mb-4 h-5"></p>

                <!-- Inputs (Pill Shape & Horizontal) -->
                <div class="w-full space-y-4">
                    <div class="input-pill-container">
                        <i class="fas fa-user input-icon-left"></i>
                        <input type="text" id="login-nick" placeholder="帳號 或 Email" class="input-field-clean" oninput="clearError()">
                    </div>
                    
                    <div class="input-pill-container">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input type="password" id="login-pass" placeholder="密碼" class="input-field-clean" oninput="clearError()">
                    </div>
                    
                    <button id="btn-login" onclick="handleLoginClick()" class="btn-pill-primary mt-6">
                        登入
                    </button>
                    
                    <div class="relative py-3">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white/80 px-3 text-slate-400 font-bold rounded-full">OR</span></div>
                    </div>

                    <button onclick="renderRegister()" class="btn-pill-secondary">
                        註冊新帳號
                    </button>
                </div>
            </div>
            <div class="mt-8 text-indigo-900/40 text-xs font-bold tracking-widest">V9.0 Cloud Sync</div>
        </div>
    `;
}

function renderRegister() {
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="h-full w-full bg-slate-50 flex flex-col items-center justify-center p-6 relative">
            <div class="glass-panel w-full max-w-sm p-8 rounded-[2.5rem] animate-fade-in shadow-xl flex flex-col items-center bg-white border-0">
                
                <button onclick="renderLogin()" class="self-start text-slate-400 mb-6 hover:text-indigo-600 transition flex items-center font-bold text-sm bg-slate-100 px-4 py-2 rounded-full">
                    <i class="fas fa-arrow-left mr-2"></i> 返回
                </button>
                
                <h1 class="text-2xl font-extrabold text-slate-800 mb-2">建立帳號</h1>
                <p class="text-slate-400 text-sm mb-6 text-center font-medium">使用 Email 註冊以確保帳號安全</p>

                <p id="reg-error" class="text-red-500 text-sm font-bold mb-4 h-5 text-center"></p>
                
                <div class="w-full space-y-3">
                    <!-- Email Field -->
                    <div class="input-pill-container">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" id="reg-email" placeholder="電子郵件" class="input-field-clean" oninput="clearRegError()">
                    </div>

                    <!-- Nickname Field -->
                    <div class="input-pill-container">
                        <i class="fas fa-user input-icon-left"></i>
                        <input type="text" id="reg-nick" placeholder="設定帳號 (英文數字)" class="input-field-clean" oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, ''); clearRegError()">
                    </div>
                    
                    <!-- Password Field -->
                    <div class="input-pill-container">
                        <i class="fas fa-key input-icon-left"></i>
                        <input type="password" id="reg-pass" placeholder="設定密碼" class="input-field-clean" oninput="clearRegError()">
                    </div>
                    
                    <!-- Register Button (Distinct Color) -->
                    <button id="btn-reg" onclick="handleRegisterClick()" class="btn-pill-primary bg-indigo-600 mt-6 shadow-indigo-200">
                        註冊
                    </button>
                </div>
            </div>
        </div>
    `;
}

function clearError() { document.getElementById('login-error').innerText = ""; }
function clearRegError() { document.getElementById('reg-error').innerText = ""; }

// --- AUTH LOGIC ---

async function handleLoginClick() {
    const nick = document.getElementById('login-nick').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('login-error');

    if(!nick || !pass) { err.innerText = "請輸入帳號或 Email 和密碼"; return; }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 登入中...';
    err.innerText = "";
    
    try { await loginUser(nick, pass, false); } 
    catch(e) { 
        btn.disabled = false; 
        btn.innerHTML = '登入'; 
        err.innerText = e.message; 
    }
}

async function handleRegisterClick() {
    const email = document.getElementById('reg-email').value.trim();
    const nick = document.getElementById('reg-nick').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    const btn = document.getElementById('btn-reg');
    const err = document.getElementById('reg-error');

    if(!email || !nick || !pass) { err.innerText = "所有欄位皆為必填"; return; }
    if(!email.includes('@')) { err.innerText = "Email 格式不正確"; return; }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 建立中...';
    err.innerText = "";

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'register', nickname: nick, password: pass, email: email })
        });
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        // Register Success -> Auto Login
        await loginUser(nick, pass, false, true); 
    } catch(e) {
        btn.disabled = false;
        btn.innerHTML = '註冊';
        err.innerText = e.message;
    }
}

async function loginUser(nick, pass, isAuto, isFirstTime = false) {
    try {
        if(!isAuto) setLoading(true, "正在登入雲端...");
        
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'login', nickname: nick, password: pass })
        });
        
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        state.user = {
            nickname: data.nickname,
            email: data.email,
            password: pass,
            totalLearned: parseInt(data.totalLearned) || 0,
            streak: parseInt(data.streak) || 1,
            points: parseInt(data.points) || 0,
            currentBook: data.currentBook || null, 
            customBooks: Array.isArray(data.customBooks) ? data.customBooks : [],
            settings: state.user?.settings || { notifications: false, notificationTime: "20:00", speechRate: 1.0 }
        };
        state.progress = data.progress || {};
        state.customBooks = state.user.customBooks;
        state.isLoggedIn = true;
        
        saveState();
        
        if(isAuto) {
            render(); 
            setLoading(false); 
        } else {
            setLoading(false);
            if(isFirstTime || !state.user.currentBook) {
                renderInitialBookSelection(document.getElementById('app')); 
            } else {
                render();
                checkAnnouncement();
            }
        }
        return true;
    } catch(e) {
        setLoading(false);
        if(isAuto) renderLogin();
        else throw e;
    }
}

// --- Initial Book Selection ---
function renderInitialBookSelection(container) {
    container.innerHTML = `
        <div class="h-full bg-slate-50 flex flex-col p-6 animate-fade-in items-center justify-center">
            <div class="w-full max-w-md bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col h-[80vh]">
                <div class="text-center mb-6 mt-4">
                    <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600 text-4xl animate-bounce">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">選擇第一本教材</h1>
                    <p class="text-slate-400 text-sm mt-1 font-medium">這將會同步到您的雲端帳號</p>
                </div>
                
                <div class="flex-1 overflow-y-auto pb-4 px-1 space-y-3">
                    ${renderSelectableBook('GEPT_Elem', '全民英檢 初級', 'bg-green-500')}
                    ${renderSelectableBook('GEPT_Inter', '全民英檢 中級', 'bg-blue-500')}
                    ${renderSelectableBook('GEPT_High', '全民英檢 中高級', 'bg-purple-500')}
                    ${renderSelectableBook('Custom_World', '單字環遊世界 (全部)', 'bg-pink-500')}
                </div>
            </div>
        </div>
    `;
}

function renderSelectableBook(id, name, color) {
    return `
        <button onclick="handleFirstBookSelect('${id}')" class="w-full bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 flex items-center space-x-4 active:scale-95 transition-all text-left hover:border-indigo-500 hover:bg-white hover:shadow-md group">
            <div class="w-12 h-12 rounded-xl ${color} text-white flex items-center justify-center text-xl shadow-sm group-hover:scale-110 transition-transform">
                <i class="fas fa-book"></i>
            </div>
            <div>
                <div class="font-bold text-slate-800 text-lg">${name}</div>
                <div class="text-xs text-slate-400 font-bold">點擊開始學習</div>
            </div>
        </button>
    `;
}

function handleFirstBookSelect(id) {
    state.user.currentBook = id;
    saveState();
    render();
    checkAnnouncement();
}

// --- Main Layout ---
function render() {
    const app = document.getElementById('app');
    if (!state.isLoggedIn) return renderLogin();
    if (!state.user.currentBook) return renderInitialBookSelection(app);
    
    app.innerHTML = `
        <div class="flex flex-col h-full bg-slate-50 w-full">
            <div id="main-content" class="content-area relative w-full overflow-hidden"></div>
            <div class="absolute bottom-0 left-0 w-full h-[85px] bg-white border-t border-slate-200 flex justify-around items-center pb-safe z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.03)]">
                ${renderNavItem('learn', '背單字', 'fa-brain')}
                ${renderNavItem('books', '選擇教材', 'fa-book-open')}
                ${renderNavItem('profile', '個人檔案', 'fa-user-astronaut')}
            </div>
        </div>`;
    renderActiveTab();
}

function renderNavItem(id, l, i) {
    const isActive = state.activeTab === id;
    const color = isActive ? 'text-indigo-600' : 'text-slate-400';
    const bg = isActive ? 'bg-indigo-50 scale-110' : 'scale-100';
    return `
        <button onclick="state.activeTab='${id}';render()" class="flex flex-col items-center justify-center w-full h-full space-y-1 transition-all group">
            <div class="px-5 py-1.5 rounded-full ${bg} transition-all duration-300">
                <i class="fas ${i} text-xl ${color} transition-colors"></i>
            </div>
            <span class="text-[10px] font-bold ${color}">${l}</span>
        </button>
    `;
}

function renderActiveTab() {
    const content = document.getElementById('main-content');
    if (state.activeTab === 'learn') renderLearnTab(content);
    else if (state.activeTab === 'books') renderMaterialsTab(content);
    else if (state.activeTab === 'profile') renderProfileTab(content);
}

// --- Tab: Learn ---
function renderLearnTab(c) {
    let words = [];
    const bookId = state.user.currentBook;
    
    if (bookId === 'GEPT_Elem') words = state.vocabulary.filter(w => w.category && w.category.includes('初級'));
    else if (bookId === 'GEPT_Inter') words = state.vocabulary.filter(w => w.category && w.category.includes('中級') && !w.category.includes('高級'));
    else if (bookId === 'GEPT_High') words = state.vocabulary.filter(w => w.category && w.category.includes('中高級'));
    else if (bookId === 'Custom_World') words = [...state.vocabulary];
    else {
        const customBook = state.customBooks.find(b => b.id === bookId);
        if (customBook) words = state.vocabulary.filter(w => customBook.words.includes(w.word));
    }

    const lessons = [];
    for (let i = 0; i < words.length; i += 7) lessons.push(words.slice(i, i + 7));

    let html = `
        <div class="p-5 pt-10 pb-28 space-y-5 animate-fade-in h-full overflow-y-auto">
            <h1 class="text-3xl font-extrabold text-slate-800 px-1">學習進度</h1>
            
            <div class="bg-indigo-600 rounded-[2rem] p-6 text-white shadow-xl shadow-indigo-200 relative overflow-hidden">
                <div class="relative z-10">

    const now = Date.now();

        return p.status === 'learned' && p.nextReview && p.nextReview <= now;
    });

    if(reviewList.length > 0) {
        html += `<div onclick="startReview()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-5 rounded-2xl shadow-lg cursor-pointer flex items-center justify-between transform active:scale-95 transition-all"><div class="font-bold flex items-center"><div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center mr-3"><i class="fas fa-fire"></i></div><span>${reviewList.length} 個單字待複習</span></div><i class="fas fa-chevron-right opacity-75"></i></div>`;
    }

    if(lessons.length === 0) html += `<div class="text-center text-slate-400 mt-10 font-bold">讀取中或無內容...</div>`;

    html += `<div class="space-y-3 pb-8">`;
    html += lessons.map((l, i) => {
        const learned = l.filter(w => state.progress[w.word]?.status === 'learned').length;

        return `
            <div onclick="startLesson(${i})" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform cursor-pointer">

    }).join('');
    html += `</div></div>`;
    c.innerHTML = html;
}

// --- Logic Helpers ---

function saveState() {
    if(!state.user) return;
    localStorage.setItem('wv_user_v9', JSON.stringify(state.user));
    
    fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'sync',
            nickname: state.user.nickname,
            customBooks: state.user.customBooks || [],
            currentBook: state.user.currentBook || '',
            totalLearned: Object.keys(state.progress).length,
            streak: state.user.streak,
            points: state.user.points,
            progress: state.progress
        })
    }).catch(e => console.log("Bg Sync Fail"));
}

function handleBookSwitch(id) {
    state.user.currentBook = id;
    saveState();
    render(); 
    checkAnnouncement();
}

function getBookName(id) {
    if(id==='GEPT_Elem') return '全民英檢初級';
    if(id==='GEPT_Inter') return '全民英檢中級';
    if(id==='GEPT_High') return '全民英檢中高級';
    if(id==='Custom_World') return '單字環遊世界';
    const c = state.customBooks.find(b=>b.id===id);
    return c ? c.name : 'Unknown';
}

function startLesson(idx) {
    let words = [];
    const bookId = state.user.currentBook;
    if (bookId === 'GEPT_Elem') words = state.vocabulary.filter(w => w.category && w.category.includes('初級'));
    else if (bookId === 'GEPT_Inter') words = state.vocabulary.filter(w => w.category && w.category.includes('中級') && !w.category.includes('高級'));
    else if (bookId === 'GEPT_High') words = state.vocabulary.filter(w => w.category && w.category.includes('中高級'));
    else if (bookId === 'Custom_World') words = [...state.vocabulary];
    else {
        const customBook = state.customBooks.find(b => b.id === bookId);
        if (customBook) words = state.vocabulary.filter(w => customBook.words.includes(w.word));
    }
    const lessons = [];
    for (let i = 0; i < words.length; i += 7) lessons.push(words.slice(i, i + 7));

    state.session.queue = [...lessons[idx]];
    state.session.currentIndex = 0;
    state.session.mode = 'card';
    state.session.reviewQueue = [];
    renderStudyScreen();
}

function startReview() {
    const allWords = state.vocabulary;
    const now = Date.now();
    const reviewWords = Object.keys(state.progress).filter(w => {
        const p = state.progress[w];
        return p.status === 'learned' && p.nextReview && p.nextReview <= now;
    }).map(w => allWords.find(v => v.word === w)).filter(Boolean);
    
    state.session.queue = reviewWords.sort(()=>Math.random()-0.5).slice(0, 10);
    state.session.currentIndex = 0;
    state.session.mode = 'card';
    renderStudyScreen();
}

function renderStudyScreen() {
    const w = state.session.queue[state.session.currentIndex];
    const content = document.getElementById('main-content');
    
    if(!w) {
        const modes = ['card', 'sentence', 'match', 'spell', 'review'];
        const next = modes[modes.indexOf(state.session.mode) + 1];
        if(next) {
             if (next === 'sentence' && !state.session.queue.some(word => word.example_en)) {
                 state.session.mode = 'match'; 
            } else {
                 state.session.mode = next;
            }
            state.session.currentIndex = 0;
            renderStudyScreen();
        } else if (state.session.reviewQueue.length>0) {
            state.session.queue = [...state.session.reviewQueue]; state.session.reviewQueue=[]; state.session.mode='card'; state.session.currentIndex=0;
            alert('進入加強練習模式！'); renderStudyScreen();
        } else {
            renderLessonComplete(content);
        }
        return;
    }
    
    let html = '';
    const progress = `${state.session.currentIndex+1}/${state.session.queue.length}`;
    
    if(state.session.mode==='card') {
        html = `
            <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto">
                <div class="w-full aspect-[3/4] bg-white rounded-3xl shadow-xl border border-slate-100 flex flex-col items-center justify-center text-center p-8 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 opacity-100 transition-opacity duration-500 group-[.flipped]:opacity-0 flex flex-col items-center justify-center p-4">
                        <h2 class="text-4xl font-bold text-white break-all drop-shadow-md">${w.word}</h2>
                        <p class="text-white/60 mt-8 text-sm font-bold tracking-widest animate-pulse">TAP TO FLIP</p>
                    </div>
                    
                    <div class="absolute inset-0 bg-white opacity-0 transition-opacity duration-500 group-[.flipped]:opacity-100 flex flex-col items-center justify-center p-6">
                        <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold mb-6">${w.part_of_speech || 'Word'}</span>
                        <h3 class="text-3xl font-bold text-slate-800 mb-6 leading-tight">${w.definition_zh}</h3>
                        <button onclick="event.stopPropagation(); speak('${w.word}')" class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 text-2xl shadow-sm mb-6 active:scale-95 transition-transform"><i class="fas fa-volume-up"></i></button>
                        ${w.example_en ? `<p class="text-sm text-slate-500 italic border-t border-slate-100 pt-4 w-full">"${w.example_en}"</p>` : ''}
                    </div>
                </div>
                <button onclick="document.querySelector('.group').classList.toggle('flipped')" class="btn-pill-secondary mt-8 w-full max-w-xs">翻面 / Flip</button>
                <button onclick="nextStep()" class="btn-pill-primary mt-4 w-full max-w-xs">下一個</button>
            </div>`;
    } 
    else if(state.session.mode==='sentence') {
        html = renderSentenceBuilder(w);
        setTimeout(initDragDrop, 100);
    }
    else if(state.session.mode==='match') {
        const others = state.vocabulary.filter(x=>x.word!==w.word).sort(()=>0.5-Math.random()).slice(0,3);
        const opts = [w, ...others].sort(()=>0.5-Math.random());
        html = `<div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto">
            <h2 class="text-4xl font-bold text-slate-800 mb-10 text-center">${w.word}</h2>
            <div class="space-y-3 w-full">
                ${opts.map(o => `<button onclick="checkMatch('${o.word}','${w.word}',this)" class="w-full bg-white p-5 rounded-2xl border-2 border-slate-100 text-slate-600 font-bold text-lg shadow-sm hover:border-indigo-200 transition-all text-left">${o.definition_zh}</button>`).join('')}
            </div>
        </div>`;
    }
    else if(state.session.mode==='review') {
        html = `<div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto text-center">
            <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 w-full mb-8">
                <h2 class="text-3xl font-bold text-slate-800 mb-2">${w.word}</h2>
                <p class="text-slate-500 text-lg">${w.definition_zh}</p>
            </div>
            <p class="text-slate-400 text-sm font-bold mb-4 uppercase tracking-widest">How well do you know this?</p>
            <div class="space-y-3 w-full">
                <button onclick="rate('green')" class="w-full bg-green-50 text-green-600 p-4 rounded-2xl font-bold border-2 border-green-100 active:scale-95 transition-transform">都很熟 (Easy)</button>
                <button onclick="rate('yellow')" class="w-full bg-amber-50 text-amber-600 p-4 rounded-2xl font-bold border-2 border-amber-100 active:scale-95 transition-transform">有點印象 (OK)</button>
                <button onclick="rate('red')" class="w-full bg-red-50 text-red-600 p-4 rounded-2xl font-bold border-2 border-red-100 active:scale-95 transition-transform">我不會 (Hard)</button>
            </div>
        </div>`;
    }
    else {
         html = `<div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto text-center">
            <button onclick="speak('${w.word}')" class="w-24 h-24 bg-indigo-600 rounded-full text-white text-3xl mb-8 shadow-xl shadow-indigo-300 animate-pulse active:scale-95 transition-transform"><i class="fas fa-volume-up"></i></button>
            <p class="text-slate-400 mb-4 font-bold">輸入聽到的單字</p>
            <input type="text" id="spell-inp" class="w-full bg-transparent border-b-4 border-indigo-200 text-center text-4xl font-bold py-2 focus:outline-none mb-8 text-slate-700 placeholder-slate-300 uppercase" placeholder="TYPE HERE" autocomplete="off">
            <button onclick="checkSpell('${w.word}')" class="btn-pill-primary">檢查答案</button>
         </div>`;
         setTimeout(() => document.getElementById('spell-inp')?.focus(), 300);
    }

    content.innerHTML = `
        <div class="h-full bg-slate-50 pt-16 pb-20 relative z-30">
            <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-40 bg-slate-50/80 backdrop-blur-sm">
                <button onclick="renderActiveTab()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-slate-400 shadow-sm border border-slate-100"><i class="fas fa-times"></i></button>
                <span class="text-xs font-bold text-slate-400 bg-white px-3 py-1 rounded-full border border-slate-100">${state.session.mode.toUpperCase()} ${progress}</span>
                <div class="w-10"></div>
            </div>
            ${html}
        </div>`;
}

function nextStep(){ state.session.currentIndex++; renderStudyScreen(); }
function speak(t) { 
    new Audio(`./audio/${t}.mp3`).play().catch(() => { 
        const u = new SpeechSynthesisUtterance(t); 
        u.lang='en-US'; 
        u.rate=state.user.settings.speechRate || 1.0; 
        speechSynthesis.speak(u); 
    }); 
}
function rate(c) { updateWordProgress(state.session.queue[state.session.currentIndex].word, c); if(c!=='green') state.session.reviewQueue.push(state.session.queue[state.session.currentIndex]); nextStep(); }
function updateWordProgress(w, r) { if (!state.progress[w]) state.progress[w] = { status: 'learned', level: 0, nextReview: 0 }; const p = state.progress[w]; if(r==='red') { p.level=0; p.nextReview=Date.now()+86400000; } else if(r==='yellow') { p.level=Math.max(1, p.level); p.nextReview=Date.now()+172800000; } else { p.level++; p.nextReview=Date.now()+(Math.pow(2, p.level)*86400000); } saveState(); }
function checkMatch(s,c,b) { if(s===c){ sounds.correct.play(); b.classList.add('bg-green-50','border-green-500','text-green-600'); setTimeout(nextStep,500); } else { sounds.wrong.play(); b.classList.add('bg-red-50','border-red-500','text-red-600'); } }
function checkSpell(w) { if(document.getElementById('spell-inp').value.trim().toLowerCase()===w.toLowerCase()){ sounds.correct.play(); nextStep(); } else { sounds.wrong.play(); document.getElementById('spell-inp').classList.add('border-red-500','text-red-500'); } }

// Sentence
function renderSentenceBuilder(w) { 
    window.targetS=w.example_en.replace(/[.,]/g,'').split(' '); 
    return `
    <div class="h-full flex flex-col justify-center items-center p-6 w-full max-w-md mx-auto">
        <h2 class="text-xl font-bold text-slate-700 mb-6 text-center leading-relaxed">${w.example_zh}</h2>
        <div id="drop" class="min-h-[100px] w-full bg-white border-2 border-dashed border-indigo-200 rounded-2xl mb-6 p-4 flex flex-wrap gap-2 justify-center content-start transition-colors"></div>
        <div id="source" class="flex flex-wrap gap-2 justify-center mb-8">
            ${window.targetS.slice().sort(()=>0.5-Math.random()).map(x=>`<div class="draggable-word bg-white border-b-4 border-indigo-100 px-4 py-2 rounded-xl font-bold text-indigo-600 cursor-pointer shadow-sm active:scale-95 active:bg-indigo-50 select-none" draggable="true" data-word="${x}">${x}</div>`).join('')}
        </div>
        <button onclick="checkSentence()" class="btn-pill-primary">檢查排列</button>
    </div>`; 
}
function initDragDrop() {
    document.querySelectorAll('.draggable-word').forEach(e => {
        e.addEventListener('click', function() { (this.parentElement.id==='source'?document.getElementById('drop'):document.getElementById('source')).appendChild(this); });
    });
}
function checkSentence(){ 
    const cur = Array.from(document.getElementById('drop').children).map(x=>x.dataset.word.toLowerCase()); 
    if(JSON.stringify(cur)===JSON.stringify(window.targetS.map(x=>x.toLowerCase()))){ 
        sounds.correct.play(); nextStep(); 
    } else { 
        sounds.wrong.play(); 
        document.getElementById('drop').classList.add('border-red-500'); 
        setTimeout(()=>document.getElementById('drop').classList.remove('border-red-500'), 500);
        state.session.currentSentenceMistakes++;
        if(state.session.currentSentenceMistakes>=3) { alert("Answer: "+window.targetS.join(' ')); nextStep(); }
    } 
}

function renderLessonComplete(c) {
    sounds.complete.play();
    c.innerHTML = `<div class="h-full flex flex-col items-center justify-center p-8 text-center animate-fade-in"><h1 class="text-3xl font-bold text-slate-800 mb-2">完成！</h1><div id="lottery-box" class="w-48 h-48 bg-white rounded-3xl shadow-lg border-4 border-indigo-50 flex items-center justify-center mb-8 text-6xl text-indigo-300"><i class="fas fa-gift"></i></div><button id="btn-lottery" onclick="playLottery()" class="btn-pill-primary bg-gradient-to-r from-pink-500 to-indigo-500 border-0">抽獎</button><button onclick="renderActiveTab()" class="mt-4 text-slate-400 font-bold">跳過</button></div>`;
}
function playLottery() {
    const btn = document.getElementById('btn-lottery');
    const box = document.getElementById('lottery-box');
    btn.disabled = true;
    let i = 0; const pts = state.remoteSettings.lotteryPoints;
    const interval = setInterval(() => { box.innerHTML = `<span class="text-indigo-500 font-bold">${pts[i%pts.length]}</span>`; i++; sounds.spin.play(); }, 80);
    setTimeout(() => {
        clearInterval(interval);
        const win = pts[Math.floor(Math.random()*pts.length)];
        box.innerHTML = `<div class="animate-float"><span class="text-5xl font-extrabold text-amber-500">+${win}</span><div class="text-xs text-slate-400 mt-2 font-bold">POINTS</div></div>`;
        state.user.points += win;
        saveState();
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        sounds.complete.play();
        btn.innerHTML = "領取";
        btn.onclick = () => renderActiveTab();
        btn.disabled = false;
    }, 2000);
}

function logout() { localStorage.removeItem('wv_user_v9'); state.user = null; state.isLoggedIn = false; renderLogin(); }
function checkAnnouncement() { if(state.remoteSettings.announcement !== "0") { document.getElementById('announcement-text').innerText = state.remoteSettings.announcement; document.getElementById('announcement-modal').classList.remove('hidden'); } }
function closeAnnouncement() { document.getElementById('announcement-modal').classList.add('hidden'); }

window.onload = initApp;
</script>
</body>
</html>
